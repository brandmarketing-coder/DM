        </div>
        <div class="flow-ed-field" style="margin-bottom:0">
          <label class="field-lbl">${t('flowDesc')}</label>
          <textarea class="field-input" rows="2" oninput="onFlowStep(${i},'desc',this.value)">${flowEsc(stepDesc(s))}</textarea>
        </div>
      </div>`;
  }).join('');
  const addStep = n < FLOW_MAX ? `<button type="button" class="flow-add" onclick="addFlowStep()">${ICON.plus}<span>${t('flowAddStep')}</span></button>` : '';
  const qrImgRow = f.qrImg ? `
      <div class="qr-ed-row">
        <img src="${f.qrImg}" alt="">
        ${iconBtn('trash', 'removeQrImg()', t('qrRemove'), 'is-del')}
      </div>` : '';
  return `
    <div class="block-ed">
      <div class="block-ed-title">${t('flowSteps')}</div>
      ${steps}
      ${addStep}
    </div>
    <div class="block-ed">
      <div class="block-ed-title">${t('flowPriceSec')}</div>
      <div class="flow-ed-field">
        <label class="field-lbl">${t('flowPriceLabel')}</label>
        <input type="text" class="field-input" value="${flowEsc(f.priceLabel)}" oninput="onFlowField('priceLabel',this.value)">
      </div>
      <div class="flow-ed-field" style="margin-bottom:0">
        <label class="field-lbl">${t('flowPrice')}</label>
        <input type="text" class="field-input" inputmode="decimal" value="${flowEsc(dispPrice(f))}" oninput="onFlowPrice(this.value)">
      </div>
    </div>
    <div class="block-ed">
      <div class="block-ed-title">${t('qrSec')}</div>
      <div class="flow-ed-field">
        <label class="field-lbl">${t('qrLabel')}</label>
        <input type="text" class="field-input" value="${flowEsc(f.qrLabel)}" oninput="onFlowField('qrLabel',this.value)">
      </div>
      <div class="flow-ed-field">
        <label class="field-lbl">${t('qrUrl')}</label>
        <input type="url" class="field-input" value="${flowEsc(f.qrUrl)}" placeholder="${QR_DEFAULT_URL}" ${f.qrImg ? 'disabled' : ''}
          oninput="onFlowField('qrUrl',this.value)">
      </div>
      <label class="qr-file-btn">${ICON.upload}<span>${t('qrUpload')}</span><input type="file" accept="image/*" onchange="onQrUpload(this)"></label>
      ${qrImgRow}
    </div>`;
}

function flowRefresh() { buildEditorBlocks(); renderDM(); }
/* 文字欄：只重繪 DM、不重建編輯區（保留輸入焦點） */
function onFlowStep(i, field, val) { state.flow.steps[i][field] = val; renderDM(); }
function onFlowField(field, val) { state.flow[field] = val; renderDM(); }
function onFlowPrice(val) { setDispPrice(state.flow, 'price', val); renderDM(); }
/* 換商品：品名／說明回到自動帶入 */
function onFlowProdId(i, pi, id) {
  const s = state.flow.steps[i];
  s.prods[pi] = id; s.name = null;
  if (pi === 0) s.desc = null;
  flowRefresh();
}
function onFlowProdSearch(el, i, pi) {
  const id = el.value.trim() ? resolveProdInput(el) : null;
  if (!id) { el.value = el.dataset.prev || prodDisplay(state.flow.steps[i].prods[pi]); return; }
  onFlowProdId(i, pi, id);
}
function addFlowProd(i) {
  const s = state.flow.steps[i];
  if (s.prods.length >= FLOW_PROD_MAX) return;
  s.prods.push((PRODUCTS[0] && PRODUCTS[0].id) || '');
  s.name = null;
  flowRefresh();
}
function delFlowProd(i, pi) {
  const s = state.flow.steps[i];
  if (s.prods.length <= 1) return;
  s.prods.splice(pi, 1);
  s.name = null;
  if (pi === 0) s.desc = null;
  flowRefresh();
}
function addFlowStep() {
  const f = state.flow;
  if (f.steps.length >= FLOW_MAX) return;
  f.steps.push({ label: '', prods: [(PRODUCTS[0] && PRODUCTS[0].id) || ''], name: null, desc: null });
  flowRefresh();
}
function delFlowStep(i) {
  if (state.flow.steps.length <= FLOW_MIN) return;
  state.flow.steps.splice(i, 1);
  flowRefresh();
}
function moveFlowStep(i, d) {
  const a = state.flow.steps, j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  flowRefresh();
}
/* 上傳 QR 圖片：縮到最長邊 600px 存成 dataURL（只存在記憶體，F5 即重設） */
function onQrUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * k));
      cv.height = Math.max(1, Math.round(img.height * k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      state.flow.qrImg = cv.toDataURL('image/png');
      flowRefresh();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeQrImg() { state.flow.qrImg = ''; flowRefresh(); }

/* 流程版面時：隱藏「選擇版面」與標題欄，「編輯內容」改為第 2 節 */
function syncFlowUI() {
  const flow = layout === 'flow';
  const secLayout = document.getElementById('sec-layout');
  if (secLayout) secLayout.parentElement.style.display = flow ? 'none' : '';
  const tag = document.getElementById('dm-tagline');
  if (tag) tag.parentElement.style.display = flow ? 'none' : '';
  const sc = document.getElementById('sec-content');
  if (sc) sc.textContent = flow ? t('secContent').replace(/^3\./, '2.') : t('secContent');
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
const getProd = id => PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
const getProdOrNull = id => id ? (PRODUCTS.find(p => p.id === id) || null) : null;

/* 取得某商品的文案（介紹／用途），以 copyKey 對應；依 lang 回傳對應語言（查不到該語言則回中文） */
function getCopy(prodId) {
  const p = getProdOrNull(prodId);
  if (!p || !p.copyKey) return null;
  const zh = (window.PRODUCT_COPY || {})[p.copyKey];
  if (!zh) return null;
  if (lang === 'zh') return zh;
  const t = (window.PRODUCT_I18N || {})[p.copyKey];
  const pick = f => (t && t[f + '_' + lang] !== undefined) ? t[f + '_' + lang] : zh[f];
  return { intro: pick('intro'), usage: pick('usage'), orig: zh.orig, series: zh.series };
}

/* 該商品（依其容量）的建議售價；無則 0 */
const getOrigNum = id => { const p = getProdOrNull(id); return p && p.orig ? Number(p.orig) : 0; };

/* 標題／促銷標語：收斂換行為空白（避免禮盒等多行介紹塞進標題時爆版） */
const cleanHeadline = s => (s || '').replace(/\r?\n+/g, ' ').replace(/[ 　]{2,}/g, ' ').trim();

/* ── 贈品標籤 ──
   預設「致贈」；使用者清空（空字串）＝ 不顯示標籤，但以 visibility 隱藏保留空間 → 版面不動。 */
const giftLabelOf = o => (o && o.giftLabel !== undefined) ? o.giftLabel : GIFT_DEFAULTS[lang];
function giftBadgeHTML(o) {
  const s = (giftLabelOf(o) || '').trim();
  /* 隱藏時仍放預設字，只是不可見 → 佔位高度與有標籤時完全一致 */
  return `<div class="dm-gift-badge${s ? '' : ' is-hidden'}">${s || GIFT_DEFAULTS[lang]}</div>`;
}
/* 品名前綴（（致贈）品名）：清空則不加前綴與括號 */
function giftPrefix(o) {
  const s = (giftLabelOf(o) || '').trim();
  return s ? paren(s) + (lang === 'zh' ? '' : ' ') : '';
}

/* 原價＝所選產品（主商品＋贈品/輔助商品）建議售價「加總」。
   定價預設＝原價；若無原價（加總為 0）則定價寫 5000、原價留空（不顯示）。 */
function applyPricing(cell, prodIds) {
  const sum = prodIds.filter(Boolean).reduce((s, id) => s + getOrigNum(id), 0);
  cell.origPrice = sum > 0 ? String(sum) : '';
  cell.price     = sum > 0 ? String(sum) : '5000';
}

/* 依「主商品」帶入文字：標題←介紹、用途←用途；沒寫的留空（不亂填）。
   介紹／用途一律取主商品，價格依所選產品加總。（四格用；cell = {prodId, giftId}） */
function applyMainCopy(cell) {
  const cp = getCopy(cell.prodId);
  cell.headline = cp ? cp.intro : '';
  cell.usage    = cp ? cp.usage : '';
  applyPricing(cell, [cell.prodId, cell.giftId]);
}

/* 兩格（產品清單模型）：標題／用途 ← 第一個主商品（無主商品則取第一個產品）；
   原價＝所有所選產品建議售價加總，定價預設＝原價（無則 5000）。 */
function applyTwoMeta(cell) {
  const prods = cell.products || [];
  const main = prods.find(p => p.role === 'main') || prods[0];
  const cp = main ? getCopy(main.prodId) : null;
  cell.headline = cp ? cp.intro : '';
  cell.usage    = cp ? cp.usage : '';
  applyPricing(cell, prods.map(p => p.prodId));
}

function fmt(v) {
  const n = v ? v.toString().replace(/,/g, '') : '';
  if (!n || isNaN(Number(n)) || n === '0') return n || '0';
  return Number(n).toLocaleString('zh-TW');
}

function enc(path) {
  /* 保留 ?v= 快取破解參數，不參與編碼 */
  const [p, q] = path.split('?');
  return p.split('/').map((s, i) => i === 0 ? s : encodeURIComponent(s)).join('/') + (q ? '?' + q : '');
}

/* ══════════════════════════════════════════════
   DM RENDER — FOUR  (2×2 grid, 4 independent cells)
══════════════════════════════════════════════ */
function cellHTML(c) {
  const mp = getProd(c.prodId);
  const gp = getProdOrNull(c.giftId);

  const giftSlot = gp ? `
    <div class="dm-cell-img-slot is-gift">
      <img src="${enc(gp.img)}" alt="${gp.name}" onerror="this.style.opacity=0.1">
    </div>` : '';

  const giftName = gp ? `<br><span class="dm-cell-gift-name">${giftPrefix(c)}${prodName(gp.id)}</span>` : '';

  const orig = origText(dispOrig(c))
    ? `<span class="dm-cell-orig">${origText(dispOrig(c))}</span>` : '';

  return `
    <div class="dm-cell">
      <div class="dm-cell-imgs">
        <div class="dm-cell-img-slot is-main">
          <img src="${enc(mp.img)}" alt="${prodName(mp.id)}" onerror="this.style.opacity=0.1">
        </div>
        ${giftSlot}
      </div>
      <div class="dm-cell-text">
        ${c.headline ? `<div class="dm-cell-headline">${cleanHeadline(c.headline)}</div>` : ''}
        <div class="dm-cell-names">${prodName(mp.id)}${giftName}</div>
        <div class="dm-cell-price-row">
          ${priceInnerCls(dispPrice(c), 'dm-cell-price', 'dm-cell-unit')}
          ${orig}
        </div>
      </div>
    </div>`;
}

function renderFour(tag) {
  return `
    <div class="dm-content">
      <div class="dm-tagline">${tag}</div>
      <div class="dm-four-grid">
        ${state.four.map(cellHTML).join('')}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   DM RENDER — TWO  (2 stacked bundles)
══════════════════════════════════════════════ */
/* 兩格：cell = { products:[{prodId, role:'main'|'sub', giftLabel}], headline, usage, price, origPrice }
   （與一格相同的產品清單模型：每個產品可調主/輔、最多 3 個） */
function bundleRowHTML(c) {
  const latin = lang !== 'zh';
  const prods = (c.products || []).filter(p => p && p.prodId);

  /* 整行品名（橫式1／特寫用；窄欄下長品名會疊成高塔）：主商品一行、輔助品（致贈）一行 */
  const namesBlock = () => `
      <div class="dm-bundle-names">${prods.map(p => p.role === 'sub'
        ? `<span class="dm-gift-line">${giftPrefix(p)}${prodName(p.prodId)}</span>`
        : prodName(p.prodId)).join('<br>')}</div>`;

  const orig = origText(dispOrig(c))
    ? `<span class="dm-orig-price">${paren(origText(dispOrig(c)))}</span>` : '';
  const desc = (c.usage || '').trim();

  // 橫式2、3：單品特寫（放大圖＋品名＋描述＋售價／原價）
  if (isFeatureTwo()) {
    const subs = prods.filter(p => p.role === 'sub');
    const cols = prods.map(p => {
      const prod = getProd(p.prodId);
      return p.role === 'sub' ? `
        <div class="dm-bprod is-gift dm-feature-gift">
          ${giftBadgeHTML(p)}
          <div class="dm-bprod-img"><img src="${enc(prod.img)}" alt="${prodName(p.prodId)}" onerror="this.style.opacity=0.1"></div>
        </div>` : `
        <div class="dm-bprod is-main dm-feature-main">
          <div class="dm-feature-img">
            <img src="${enc(prod.img)}" alt="${prodName(p.prodId)}" onerror="this.style.opacity=0.1">
          </div>
        </div>`;
    }).join('');
    return `
      <div class="dm-bundle-row dm-feature-row${subs.length ? ' has-gift' : ''}">
        <div class="dm-feature-imgs">${cols}</div>
        ${prods.length > 1 ? namesBlock() : `<div class="dm-feature-name">${prods[0] ? prodName(prods[0].prodId) : ''}</div>`}
        ${desc ? `<div class="dm-feature-desc">${desc}</div>` : ''}
        <div class="dm-feature-price">
          <span class="dm-price-grp">${priceInner(dispPrice(c))}</span>
        </div>
        ${orig ? `<div class="dm-feature-orig">${orig}</div>` : ''}
      </div>`;
  }

  const hl = c.headline
    ? `<span class="dm-headline-lbl">${cleanHeadline(c.headline)}</span>` : '';

  /* 直式：等寬欄、品名於各商品圖下方平行排列（欄寬足夠不爆塔）；
     橫式1：白框窄，品名維持圖下整行。 */
  const perColNames = !isLandscape();
  const cols = prods.map(p => {
    const prod = getProd(p.prodId);
    const isMain = p.role === 'main';
    return `
        <div class="dm-bprod ${isMain ? 'is-main' : 'is-gift'}">
          ${isMain ? '' : giftBadgeHTML(p)}
          <div class="dm-bprod-img">
            <img src="${enc(prod.img)}" alt="${prodName(p.prodId)}" onerror="this.style.opacity=0.1">
          </div>
          ${perColNames ? `<div class="dm-bprod-name">${prodName(p.prodId)}</div>` : ''}
        </div>`;
  }).join('');

  return `
    <div class="dm-bundle-row">
      <div class="dm-bundle-pair${prods.length >= 3 ? ' has-3' : ''}">
        ${cols}
      </div>
      ${perColNames ? '' : namesBlock()}
      ${desc ? `<div class="dm-bundle-desc">${desc}</div>` : ''}
      <div class="dm-bundle-price-row">
        ${hl}
        <span class="dm-price-grp">${priceInner(dispPrice(c))}</span>
        ${orig}
      </div>
    </div>`;
}

function renderTwo(tag) {
  return `
    <div class="dm-content is-two-grid">
      <div class="dm-tagline">${tag}</div>
      <div class="dm-two-rows">
        ${bundleRowHTML(state.two[0])}
        ${bundleRowHTML(state.two[1])}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   DM RENDER — ONE  (single centred)
══════════════════════════════════════════════ */
function renderOne(tag, subtitle) {
  const c = state.one[0];
  
  // Render each product dynamically based on its role
  const prodsHtml = c.products.map(p => {
    const prod = getProd(p.prodId);
    if (p.role === 'main') {
      return `
        <div class="dm-bprod is-main">
          <div class="dm-bprod-img">
            <img src="${enc(prod.img)}" alt="${prodName(prod.id)}" onerror="this.style.opacity=0.1">
          </div>
          <div class="dm-bprod-name">${prodName(prod.id)}</div>
        </div>
      `;
    } else {
      return `
        <div class="dm-bprod is-gift">
          ${giftBadgeHTML(p)}
          <div class="dm-bprod-img">
            <img src="${enc(prod.img)}" alt="${prodName(prod.id)}" onerror="this.style.opacity=0.1">
          </div>
          <div class="dm-bprod-name">${prodName(prod.id)}</div>
        </div>
      `;
    }
  }).join('');

  // 橫式：圖片與品名分兩列（grid），使圖片底部恆對齊、且品名只有一行時不留空行
  const imgCells = c.products.map(p => {
    const prod = getProd(p.prodId);
    const badge = p.role !== 'main' ? giftBadgeHTML(p) : '';
    return `<div class="dm-one-imgcell ${p.role === 'main' ? 'is-main' : 'is-gift'}">${badge}<div class="dm-bprod-img"><img src="${enc(prod.img)}" alt="${prodName(prod.id)}" onerror="this.style.opacity=0.1"></div></div>`;
  }).join('');
  const nameCells = c.products.map(p => `<div class="dm-one-namecell">${prodName(p.prodId)}</div>`).join('');

  const orig = origText(dispOrig(c))
    ? `<span class="dm-orig-price">${paren(origText(dispOrig(c)))}</span>` : '';

  const hlBlock = c.headline
    ? `<div class="dm-one-headline">${cleanHeadline(c.headline)}</div>` : '';

  const has3Prods = c.products.length >= 3;
  const pairClass = has3Prods ? 'dm-one-pair has-3-prods'
                  : c.products.length === 1 ? 'dm-one-pair has-1-prod'
                  : 'dm-one-pair';
  const colGap = has3Prods ? 16 : 28;

  // 用途：每個商品一欄，與上方商品對齊；每個產品都顯示自己的用途（不去重，即使相同也各自顯示）
  let anyUsage = false;
  const usageCols = c.products.map(p => {
    const u = (p.usage || '').trim();
    if (!u) return `<div class="dm-one-usage-col"></div>`;
    anyUsage = true;
    return `<div class="dm-one-usage-col"><span class="dm-one-usage-text">${u}</span></div>`;
  }).join('');
  const usageHtml = anyUsage ? `<div class="dm-one-usage">${usageCols}</div>` : '';

  const priceMain =
    `<span class="dm-one-price-main">${priceInner(dispPrice(c))}</span>`;

  /* 橫式：標題／促銷標語＋售價同一行，原價換行且右緣切齊上行的「元」；
     直式維持原本（標題獨立行、售價列）。pricewrap 寬度＝標題+售價的內容寬，
     原價於此寬度內靠右 → 右緣對齊售價「元」。 */
  const priceBlock = isLandscape() ? `
        <div class="dm-one-pricewrap">
          <div class="dm-one-headprice">
            ${c.headline ? `<span class="dm-one-headline-i">${cleanHeadline(c.headline)}</span>` : ''}
            ${priceMain}
          </div>
          ${orig ? `<div class="dm-one-origline">${orig}</div>` : ''}
        </div>
  ` : `
        ${hlBlock}
        <div class="dm-one-price-row">
          ${priceMain}
          ${orig}
        </div>
  `;

  const pairInner = isLandscape()
    ? `<div class="${pairClass}" style="--ncols:${c.products.length}">${imgCells}${nameCells}</div>`
    : `<div class="${pairClass}">${prodsHtml}</div>`;

  return `
    <div class="dm-content is-one-grid">
      <div class="dm-tagline">${tag}</div>
      ${subtitle ? `<div class="dm-subtitle">${subtitle}</div>` : ''}
      <div class="dm-one-block" style="--colGap:${colGap}px">
        ${pairInner}
        ${usageHtml}
        ${priceBlock}
      </div>
    </div>`;
}

/* 重設＝重新整理（F5 同義）：一律回到預設（直式・四格） */
function resetAll() {
  if (!confirm(t('resetConfirm'))) return;
  try { localStorage.removeItem('dm-editor-state-v1'); } catch (e) {}   // 清除舊版存檔殘留
  location.reload();
}

/* ══════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════ */
const HDR = '../沙龍DM公版/直式/直式-頁首.jpg';
const FTR = '../沙龍DM公版/直式/直式-頁尾.jpg';

function renderDM() {
  const tag = document.getElementById('dm-tagline')?.value || '';
  const subtitle = document.getElementById('dm-subtitle')?.value || '';
  const body = layout === 'flow' ? renderFlow()
             : layout === 'four' ? renderFour(tag)
             : layout === 'two'  ? renderTwo(tag)
             : renderOne(tag, subtitle);
  const sheet = document.getElementById('dm-sheet');

  /* 外文（EN/PL）加 lang-latin：品名改整行排版、禁止單字中斷等視覺調整 */
  const latinCls = lang === 'zh' ? '' : ' lang-latin';
  if (isFullBg()) {
    /* 滿版底圖模式（橫式 1~4、直式大促 p2）：底圖鋪滿＋內容區絕對定位 */
    sheet.className = ((isLandscape() ? 'is-landscape ' : '') + 'bg-' + bgTemplate + latinCls);
    const p = LAND_POS[bgTemplate];
    /* inline style 讓 html2canvas proxy 複製 innerHTML 後仍保有正確定位 */
    const posStyle =
      `position:absolute;z-index:1;display:flex;flex-direction:column;overflow:hidden;` +
      `left:${p.left};top:${p.top};right:${p.right};bottom:${p.bottom}`;
    sheet.innerHTML =
      `<img class="dm-bg-full" src="${enc(LAND_BG[bgTemplate])}" alt="">` +
      `<div class="dm-land-content" style="${posStyle}">${body}</div>`;
  } else {
    sheet.className = latinCls.trim();
    sheet.innerHTML =
      `<div class="dm-hdr"><img src="${enc(HDR)}" alt="header"></div>` +
      body +
      `<div class="dm-ftr"><img src="${enc(FTR)}" alt="footer"></div>`;
  }

  fitDM();
  if (!isLandscape()) {
    // 直式：頁首/頁尾圖載入後內容高度才確定，載完後重新渲染校正（圖已快取，不會重複觸發）
    sheet.querySelectorAll('.dm-hdr img, .dm-ftr img').forEach(img => {
      if (!img.complete) img.addEventListener('load', () => renderDM(), { once: true });
    });
  }
}

/* ══════════════════════════════════════════════
   AUTO-FIT（防破版）：渲染後依實際溢出逐步縮小。
   原則：先縮次要文字、再縮商品圖、最後縮價格，內容完整保留不刪減。
   inline style 每次 renderDM 重建 innerHTML 時歸零，故縮放不累積。
══════════════════════════════════════════════ */

/* 元素溢出量：以子孫節點的實際外框（rect）比對容器外框。
   不能用 scrollHeight（flex-end/center 的上緣溢出不計入），也不能攤平 flex 對齊來量
   （column flex 改 align-items 會改變子元素寬度→換行改變→假性溢出）。 */
function overOf(el) {
  if (!el) return 0;
  const r = el.getBoundingClientRect();
  let over = 0;
  el.querySelectorAll('*').forEach(d => {
    const dr = d.getBoundingClientRect();
    if (!dr.width && !dr.height) return;   // 忽略隱藏元素
    over = Math.max(over, dr.bottom - r.bottom, r.top - dr.top, dr.right - r.right, r.left - dr.left);
  });
  return over;
}

/* 字級縮小一步：各元素 -step px，低於「初始字級×minRatio」者不再縮；全到下限回 false */
function fontStep(els, minRatio, step = 0.5) {
  const bases = els.map(el => parseFloat(getComputedStyle(el).fontSize));
  return () => {
    let changed = false;
    els.forEach((el, i) => {
      const cur = parseFloat(el.style.fontSize) || bases[i];
      if (cur - step >= bases[i] * minRatio) { el.style.fontSize = (cur - step) + 'px'; changed = true; }
    });
    return changed;
  };
}

/* 尺寸縮小一步：高度每步約 -4%（等比縮寬，keepWidth=true 只縮高），低於初始×minRatio 不再縮 */
function sizeStep(els, minRatio, keepWidth = false) {
  const bases = els.map(el => ({ w: el.offsetWidth, h: el.offsetHeight }));
  return () => {
    let changed = false;
    els.forEach((el, i) => {
      const cur = parseFloat(el.style.height) || bases[i].h;
      const next = cur - Math.max(2, bases[i].h * 0.04);
      if (next >= bases[i].h * minRatio) {
        el.style.height = next.toFixed(1) + 'px';
        if (!keepWidth) el.style.width = (bases[i].w * next / bases[i].h).toFixed(1) + 'px';
        changed = true;
      }
    });
    return changed;
  };
}

/* 贈品標籤縮小一步：字級／上下內距／下邊距「等比例」同步縮（維持膠囊比例，不會壓成扁餅）。
   字級下限＝初始的 72%；高度由 padding 撐出，故不直接設 height。 */
function badgeStep(els) {
  const bases = els.map(el => {
    const cs = getComputedStyle(el);
    return { fs: parseFloat(cs.fontSize), pt: parseFloat(cs.paddingTop) || 0,
             px: parseFloat(cs.paddingLeft) || 0, mb: parseFloat(cs.marginBottom) || 0 };
  });
  return () => {
    let changed = false;
    els.forEach((el, i) => {
      const b = bases[i];
      const cur = parseFloat(el.style.fontSize) || b.fs;
      const next = cur - 0.5;
      if (next >= b.fs * 0.72) {
        const k = next / b.fs;                       // 等比例係數
        el.style.fontSize = next + 'px';
        el.style.padding = (b.pt * k).toFixed(1) + 'px ' + (b.px * k).toFixed(1) + 'px';
        el.style.marginBottom = Math.max(2, b.mb * k).toFixed(1) + 'px';
        changed = true;
      }
    });
    return changed;
  };
}

/* 內距縮小一步：上下 padding 各 -1px（下限 2px） */
function padStep(els) {
  const bases = els.map(el => {
    const cs = getComputedStyle(el);
    return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
  });
  return () => {
    let changed = false;
    els.forEach((el, i) => {
      const t = el.style.paddingTop !== '' ? parseFloat(el.style.paddingTop) : bases[i].t;
      const b = el.style.paddingBottom !== '' ? parseFloat(el.style.paddingBottom) : bases[i].b;
      if (t - 1 >= 2) { el.style.paddingTop = (t - 1) + 'px'; changed = true; }
      if (b - 1 >= 2) { el.style.paddingBottom = (b - 1) + 'px'; changed = true; }
    });
    return changed;
  };
}

/* 依序執行縮小階段：前一階段到下限仍溢出才進入下一階段 */
function shrinkStages(measure, stages) {
  for (const stage of stages) {
    let guard = 0;
    while (measure() > 1 && guard++ < 60) { if (!stage()) break; }
    if (measure() <= 1) return;
  }
}

/* 標題／副標：超過 maxLines 行時逐步縮字級（至初始的 55%），維持 1~2 行較美觀 */
function fitHeadingLine(sel, maxLines) {
  const el = document.querySelector('#dm-sheet ' + sel);
  if (!el || !el.textContent.trim()) return;
  const cs = () => getComputedStyle(el);
  const contentH = () => el.clientHeight - parseFloat(cs().paddingTop) - parseFloat(cs().paddingBottom);
  const lineH = () => {
    const lh = parseFloat(cs().lineHeight);
    return isNaN(lh) ? parseFloat(cs().fontSize) * 1.3 : lh;
  };
  const base = parseFloat(cs().fontSize);
  let fs = base, guard = 0;
  while (contentH() > lineH() * (maxLines + 0.4) && fs > base * 0.55 && guard++ < 40) {
    fs -= 1; el.style.fontSize = fs + 'px';
  }
}

/* 四格：逐格縮放（headline/品名 → 圖高 → 價格） */
function fitFourGrid() {
  const cells = [...document.querySelectorAll('#dm-sheet .dm-cell')];
  // 第一遍：逐格縮放到各自塞得下
  cells.forEach(cell => {
    const text = cell.querySelector('.dm-cell-text');
    const measure = () => Math.max(overOf(cell), overOf(text));
    const q = s => [...cell.querySelectorAll(s)];
    shrinkStages(measure, [
      fontStep(q('.dm-cell-names'), 0.62),                                  // 1) 先縮品名（長品名是占高主因，優先保住標語）
      sizeStep(q('.dm-cell-imgs'), 0.5, true),                              // 2) 縮圖高
      fontStep([...q('.dm-cell-headline'), ...q('.dm-cell-names')], 0.6),    // 3) 標語＋品名一起
      fontStep([...q('.dm-cell-price'), ...q('.dm-cell-unit'), ...q('.dm-cell-orig')], 0.7),
      fontStep([...q('.dm-cell-headline'), ...q('.dm-cell-names'),           // 4) 最後保險：全格文字再縮
               ...q('.dm-cell-price'), ...q('.dm-cell-unit'), ...q('.dm-cell-orig')], 0.5),
    ]);
  });
  // 第二遍：各類文字取「四格最小字級」統一套用、圖高取最小統一
  // → 四格字級一致、價格列貼底對齊，不會一格大一格小（取最小值不會產生新溢出）
  for (const sel of ['.dm-cell-headline', '.dm-cell-names', '.dm-cell-price', '.dm-cell-unit', '.dm-cell-orig']) {
    const els = cells.flatMap(c => [...c.querySelectorAll(sel)]);
    if (els.length < 2) continue;
    const min = Math.min(...els.map(el => parseFloat(getComputedStyle(el).fontSize)));
    els.forEach(el => { el.style.fontSize = min + 'px'; });
  }
  const imgBoxes = cells.map(c => c.querySelector('.dm-cell-imgs')).filter(Boolean);
  if (imgBoxes.length > 1) {
    /* 必須用 offsetHeight（版面尺寸）：getBoundingClientRect 受預覽縮放 transform 影響，
       會把縮放後的視覺高度誤設為實際高度 → 版面跑掉 */
    const minH = Math.min(...imgBoxes.map(el => el.offsetHeight));
    imgBoxes.forEach(el => { el.style.height = minH + 'px'; });
  }
}

/* 兩格：一般（直式／橫式1）與單品特寫（橫式2/3）各自縮放 */
function fitTwoGrid() {
  document.querySelectorAll('#dm-sheet .dm-bundle-row:not(.dm-feature-row)').forEach(row => {
    const pair = row.querySelector('.dm-bundle-pair');
    const measure = () => Math.max(overOf(row), overOf(pair));
    const q = s => [...row.querySelectorAll(s)];
    shrinkStages(measure, [
      sizeStep(q('.dm-bprod-img'), 0.55),  // 1) 先縮商品圖：文字可讀性優先
      badgeStep(q('.dm-gift-badge')),      // 2) 縮贈品標籤高度與下邊距
      padStep([row]),                      // 3) 縮列上下內距
      fontStep(q('.dm-bundle-desc'), 0.8), // 4) 之後才開始縮文字
      fontStep([...q('.dm-bprod-name'), ...q('.dm-bundle-names'), ...q('.dm-headline-lbl')], 0.75),
      sizeStep(q('.dm-bprod-img'), 0.25),  // 5) 極端長描述：商品圖再讓位
      fontStep([...q('.dm-price-num'), ...q('.dm-price-unit'), ...q('.dm-orig-price')], 0.7),
      fontStep([...q('.dm-bprod-name'), ...q('.dm-bundle-names'), ...q('.dm-headline-lbl'), ...q('.dm-bundle-desc'), ...q('.dm-price-num'), ...q('.dm-price-unit'), ...q('.dm-orig-price')], 0.5), // 最後保險（badge 由 badgeStep 等比例縮）
    ]);
  });
  document.querySelectorAll('#dm-sheet .dm-feature-row').forEach(row => {
    const measure = () => overOf(row);
    const q = s => [...row.querySelectorAll(s)];
    shrinkStages(measure, [
      fontStep(q('.dm-feature-desc'), 0.7),
      fontStep([...q('.dm-feature-name'), ...q('.dm-bprod-name'), ...q('.dm-bundle-names')], 0.75),
      sizeStep([...q('.dm-feature-img'), ...q('.dm-feature-gift .dm-bprod-img')], 0.55),
      badgeStep(q('.dm-gift-badge')),
      padStep([row]),
      fontStep([...q('.dm-price-num'), ...q('.dm-price-unit'), ...q('.dm-orig-price')], 0.7),
      sizeStep([...q('.dm-feature-img'), ...q('.dm-feature-gift .dm-bprod-img')], 0.3),   // 極端：圖再讓位
      fontStep([...q('.dm-feature-name'), ...q('.dm-bprod-name'), ...q('.dm-bundle-names'), ...q('.dm-feature-desc')], 0.55), // 最後保險（badge 由 badgeStep 等比例縮）
    ]);
  });
  unifyTwoRows();
}

/* 兩列各自縮放後：各類文字／標籤取「兩列最小值」統一，避免上下一大一小
   （取最小值不會產生新溢出） */
function unifyTwoRows() {
  const rows = [...document.querySelectorAll('#dm-sheet .dm-bundle-row')];
  if (rows.length < 2) return;
  for (const sel of ['.dm-bprod-name', '.dm-bundle-names', '.dm-bundle-desc', '.dm-feature-name', '.dm-feature-desc',
                     '.dm-headline-lbl', '.dm-price-num', '.dm-price-unit', '.dm-orig-price']) {
    const els = rows.flatMap(r => [...r.querySelectorAll(sel)]);
    if (els.length < 2) continue;
    const min = Math.min(...els.map(el => parseFloat(getComputedStyle(el).fontSize)));
    els.forEach(el => { el.style.fontSize = min + 'px'; });
  }
  /* 贈品標籤：字級最小者為準，內距／下邊距等比例套用（維持膠囊比例、上下一致） */
  const badges = rows.flatMap(r => [...r.querySelectorAll('.dm-gift-badge')]);
  if (badges.length > 1) {
    const info = badges.map(el => {
      const cs = getComputedStyle(el);
      return { el, fs: parseFloat(cs.fontSize), pt: parseFloat(cs.paddingTop) || 0,
               px: parseFloat(cs.paddingLeft) || 0, mb: parseFloat(cs.marginBottom) || 0 };
    });
    const min = info.reduce((a, b) => a.fs <= b.fs ? a : b);
    info.forEach(i => {
      const k = min.fs / i.fs;
      i.el.style.fontSize = min.fs + 'px';
      i.el.style.padding = (i.pt * k).toFixed(1) + 'px ' + (i.px * k).toFixed(1) + 'px';
      i.el.style.marginBottom = Math.max(2, i.mb * k).toFixed(1) + 'px';
    });
  }
  /* 商品圖高度也取最小統一 → 兩列商品底線一致（用 offsetHeight，不受預覽縮放影響） */
  const imgs = rows.flatMap(r => [...r.querySelectorAll('.dm-bprod-img')]);
  const mains = imgs.filter(el => el.closest('.dm-bprod')?.classList.contains('is-main'));
  const gifts = imgs.filter(el => el.closest('.dm-bprod')?.classList.contains('is-gift'));
  for (const group of [mains, gifts]) {
    if (group.length < 2) continue;
    const minH = Math.min(...group.map(el => el.offsetHeight));
    group.forEach(el => {
      const r = el.offsetWidth / el.offsetHeight;
      el.style.height = minH + 'px';
      el.style.width = (minH * r).toFixed(1) + 'px';
    });
  }
}

/* 渲染後統一入口：先收斂主/副標行數，再依版面縮放 */
function fitDM() {
  if (layout === 'flow') { fitFlow(); return; }
  fitHeadingLine('.dm-tagline', 2);
  fitHeadingLine('.dm-subtitle', 2);
  if (layout === 'one') fitOneGrid();
  else if (layout === 'two') fitTwoGrid();
  else fitFourGrid();
}

/* ── 一格自動縮放：用途文字 3 行以上時，先縮字級（10→8pt），仍超出再等比縮小商品圖，
      確保內容不爆版、且文字不刪減 ── */
function fitOneGrid() {
  const block = document.querySelector('#dm-sheet .dm-one-block');
  if (!block) return;
  const overflow = () => overOf(block);
  // 用途字級起始：各版統一 12pt；下限 橫式1 7pt／其餘橫式 8pt／直式 8.5pt
  //（文字可讀性優先，空間不足時先縮商品圖；下限維持以防長文字破版）
  const isH1 = bgTemplate === 'h1';
  const usageFloor = isH1 ? 7 : (isLandscape() ? 8 : 8.5);
  let fs = 12, hf = 24, scale = 1, guard = 0;
  block.style.setProperty('--usageFS', fs + 'pt');
  block.style.setProperty('--headlineFS', hf + 'px');
  block.style.setProperty('--imgScale', scale);
  while (overflow() > 1 && fs > usageFloor && guard++ < 20) {  // 1) 縮用途字級
    fs -= 0.5; block.style.setProperty('--usageFS', fs + 'pt');
  }
  guard = 0;
  while (overflow() > 1 && hf > 13 && guard++ < 30) {       // 2) 縮標題字級到 13px（長介紹/禮盒）
    hf -= 1; block.style.setProperty('--headlineFS', hf + 'px');
  }
  guard = 0;
  const nameStep = fontStep([...block.querySelectorAll('.dm-bprod-name, .dm-one-namecell')], 0.8);
  while (overflow() > 1 && guard++ < 30) {                  // 2.5) 縮品名（比縮圖更不傷視覺）
    if (!nameStep()) break;
  }
  guard = 0;
  const minScale = isLandscape() ? 0.3 : 0.45;   // 橫式（尤其橫1白框較小）允許縮更多以免裁切
  while (overflow() > 1 && scale > minScale && guard++ < 40) {   // 3) 仍超出→縮商品圖
    scale -= 0.05; block.style.setProperty('--imgScale', scale.toFixed(2));
  }
  guard = 0;
  const lastStep = fontStep([...block.querySelectorAll(       // 4) 最後保險：全區文字再縮
    '.dm-one-usage, .dm-bprod-name, .dm-one-namecell, ' +      //（badge 改由 badgeStep 等比例縮）
    '.dm-price-num, .dm-price-unit, .dm-orig-price, .dm-one-headline, .dm-one-headline-i')], 0.7);
  const lastBadge = badgeStep([...block.querySelectorAll('.dm-gift-badge')]);
  while (overflow() > 1 && guard++ < 40) {
    const a = lastStep(), b = lastBadge();
    if (!a && !b) break;
  }
}

/* ══════════════════════════════════════════════
   EDITOR BLOCKS
══════════════════════════════════════════════ */
function opts(selectedId) {
  /* 下拉選單顯示依當前語言（en 用國際部官方品名） */
  return PRODUCTS.map(p =>
    `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>【${p.series}】 ${prodName(p.id)}</option>`
  ).join('');
}

/* ── 可搜尋的產品選擇（input + datalist）：點選顯示全列表、打字即時過濾 ── */
function prodDisplay(id) {
  const p = getProdOrNull(id);
  return p ? `【${p.series}】 ${prodName(p.id)}` : '';
}
function buildProdDatalist() {
  const optsHtml = PRODUCTS.map(p => `<option value="【${p.series}】 ${prodName(p.id)}"></option>`).join('');
  const dl = document.getElementById('prod-datalist');
  if (dl) dl.innerHTML = optsHtml;
  const gdl = document.getElementById('prod-datalist-gift');   // 贈品欄多一個「不顯示」選項
  if (gdl) gdl.innerHTML = `<option value="${t('giftNone')}"></option>` + optsHtml;
}
/* 由輸入值解析商品 id：完整顯示名／id／品名；否則唯一子字串命中也接受。查無回 null */
function resolveProdInput(el) {
  const v = el.value.trim();
  if (!v) return null;
  const hit = PRODUCTS.find(p => `【${p.series}】 ${prodName(p.id)}` === v)
    || PRODUCTS.find(p => p.id === v || p.name === v || prodName(p.id) === v);
  if (hit) return hit.id;
  const subs = PRODUCTS.filter(p => (`【${p.series}】 ${prodName(p.id)} ${p.name}`).includes(v));
  return subs.length === 1 ? subs[0].id : null;
}
/* 聚焦：暫存原值並清空 → datalist 顯示全部選項（否則被目前值過濾成一項＝「固定住」）。
   離開時沒選新的 → 恢復原值。 */
function prodSearchFocus(el) {
  el.dataset.prev = el.value;
  el.value = '';
}
function prodSearchBlur(el) {
  setTimeout(() => {
    if (document.body.contains(el) && el.value.trim() === '') el.value = el.dataset.prev || '';
  }, 0);
}
/* 觸控裝置（手機/平板）：datalist＋鍵盤體驗差 → 改用系統原生選單；桌面維持可打字搜尋 */
const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function prodSearchInput(curId, onchangeExpr, allowEmpty, selectExpr) {
  if (IS_TOUCH) {
    return `<select class="prod-sel" onchange="${selectExpr}">
      ${allowEmpty ? `<option value="">${t('giftNone')}</option>` : ''}
      ${opts(curId)}
    </select>`;
  }
  return `<input type="text" class="prod-sel" list="${allowEmpty ? 'prod-datalist-gift' : 'prod-datalist'}" autocomplete="off"
    value="${prodDisplay(curId)}" placeholder="${t('searchPh')}"
    onfocus="prodSearchFocus(this)" onblur="prodSearchBlur(this)" onchange="${onchangeExpr}">`;
}
/* 三種編輯器的搜尋事件（空值/查無＝恢復原值不動狀態；贈品欄選「不顯示」才移除） */
function onProdSearch(el, idx, field, allowEmpty) {
  const restore = () => { el.value = el.dataset.prev || prodDisplay(state.four[idx][field]); };
  const v = el.value.trim();
  if (allowEmpty && v === t('giftNone')) { onProd(idx, field, ''); return; }
  if (!v) { restore(); return; }
  const id = resolveProdInput(el);
  if (id === null) { restore(); return; }
  onProd(idx, field, id);
}
function onTwoProdSearch(el, ci, pi) {
  const id = el.value.trim() ? resolveProdInput(el) : null;
  if (!id) { el.value = el.dataset.prev || prodDisplay(state.two[ci].products[pi].prodId); return; }
  onTwoProdId(ci, pi, id);
}
function onOneProdSearch(el, pi) {
  const id = el.value.trim() ? resolveProdInput(el) : null;
  if (!id) { el.value = el.dataset.prev || prodDisplay(state.one[0].products[pi].prodId); return; }
  onOneProdId(pi, id);
}

function cellEditor(idx, title) {
  if (layout === 'one') {
    const c = state.one[0];
    const prodsHtml = c.products.map((p, i) => oneGridProductEditor(p, i)).join('');

    return `
      <div class="block-ed">
        <div class="block-ed-title">${title}</div>

        <div style="margin-bottom: 12px;">
          <div class="ed-list-head">
            <span class="field-lbl">${t('prodList')}</span>
            ${c.products.length < 3 ? iconBtn('plus', 'addOneProd()', t('addProduct'), 'is-add') : ''}
          </div>
          ${prodsHtml}
        </div>

        <div class="headline-field">
          <label class="field-lbl">${t('headlineField')}</label>
          <input type="text" class="field-input" style="padding:5px 8px"
            value="${c.headline}" placeholder="${t('headlinePh')}"
            oninput="onField(${idx},'headline',this.value)">
        </div>
        <div class="price-pair">
          <div class="price-slot">
            <label>${t('priceLabel')}</label>
            <input type="text" class="price-input" value="${dispPrice(c)}"
              oninput="onField(${idx},'price',this.value)">
          </div>
          <div class="price-slot">
            <label>${t('origLabel')}</label>
            <input type="text" class="price-input" value="${dispOrig(c)}"
              oninput="onField(${idx},'origPrice',this.value)">
          </div>
        </div>
      </div>
    `;
  }

  if (layout === 'two') {
    const c = state.two[idx];

/* 匯出函式庫延遲載入：頁面啟動不再被 CDN 阻塞，按下匯出時才抓（之後快取重用） */
let exportLibsPromise = null;
function ensureExportLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (!exportLibsPromise) {
    const load = src => new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.crossOrigin = 'anonymous';
      s.onload = res; s.onerror = () => { exportLibsPromise = null; rej(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    });
    exportLibsPromise = Promise.all([
      window.html2canvas ? Promise.resolve() : load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? Promise.resolve() : load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    ]);
  }
  return exportLibsPromise;
}

async function generateCanvas() {
  await ensureExportLibs();
  /* 流程版面：QR 函式庫與細體數字字型就緒後再重繪，避免匯出到佔位圖／替代字型 */
  if (layout === 'flow') {
    if (!state.flow.qrImg && (state.flow.qrUrl || '').trim()) { try { await ensureQrLib(); } catch (e) {} }
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    renderDM();
  }
  /* 直接渲染真正的 #dm-sheet（不用 proxy）：樣式天生與預覽一致，
     也避免「重複 id」造成 html2canvas 卡死。
     渲染前暫時把預覽縮放(transform)設為 1，使輸出為原生 A4 尺寸，完成後還原。 */
  const real = document.getElementById('dm-sheet');
  const wrap = document.getElementById('dmWrap');
  const W = isLandscape() ? 842 : 595;
  const H = isLandscape() ? 595 : 842;
  const prevTransform = wrap.style.transform;
  const prevShadow = real.style.boxShadow;
  wrap.style.transform = 'translate(-50%, -50%) scale(1)';
  real.style.boxShadow = 'none';

  try {
    // 等圖片載入；每張最多等 4 秒，避免任一張未觸發 load 而永久卡住
    await Promise.all([...real.querySelectorAll('img')].map(img =>
      (img.complete && img.naturalWidth) ? Promise.resolve() :
        new Promise(r => {
          img.addEventListener('load', r, { once: true });
          img.addEventListener('error', r, { once: true });
          setTimeout(r, 4000);
        })
    ));
    // 用 setTimeout 而非 requestAnimationFrame：rAF 在背景分頁不會觸發會導致卡住
    await new Promise(r => setTimeout(r, 30));

    const canvas = await html2canvas(real, {
      scale: 2,
      width: W,
      height: H,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false,
    });
    return canvas;
  } finally {
    wrap.style.transform = prevTransform;
    real.style.boxShadow = prevShadow;
  }
}

/* ── 環境偵測（決定檔案交付方式）──
   iOS 上 Safari／Chrome／LINE 全是 WebKit 核心：<a download> 對 data: URL 的行為隨版本浮動
   （開新分頁預覽／跳「下載」提示／完全沒反應），且產生檔案需時數秒，等到 click() 時
   使用者手勢已過期，開新分頁會被當彈出視窗擋掉。App 內建瀏覽器（LINE／FB／IG）更是直接封鎖下載。 */
const UA = navigator.userAgent || '';
const IS_IOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_INAPP = /\bLine\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger/i.test(UA);
const IS_MOBILE = IS_IOS || /Android/i.test(UA) || IS_TOUCH;

/* canvas → Blob（比 data: URL 小 33%、不受 URL 長度限制；舊 WebKit 無 toBlob 時退回 dataURL 轉換） */
function canvasToBlob(canvas, type, quality) {
  return new Promise((res, rej) => {
    if (canvas.toBlob) { canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob returned null')), type, quality); return; }
    const bin = atob(canvas.toDataURL(type, quality).split(',')[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    res(new Blob([arr], { type }));
  });
}

/* 一般下載（桌面主路徑；手機視窗內「下載檔案」也用它） */
function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

/* 交付檔案：桌面直接下載；手機／內建瀏覽器開「匯出結果視窗」
   （長按存相簿 ＋ 系統分享→儲存影像 ＋ 一般下載，三條路徑任一可用即可） */
function deliverFile(blob, filename, kind) {
  const url = URL.createObjectURL(blob);
  if (!IS_MOBILE && !IS_INAPP) {
    triggerDownload(url, filename);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return;
  }
  openShareModal({ blob, url, filename, kind });
}

/* ── 匯出結果視窗 ── */
let shareFile = null;
function openShareModal(f) {
  closeShareModal();
  shareFile = f;
  const isImg = f.kind === 'jpg';
  document.getElementById('share-title').textContent = t('shareTitle');
  document.getElementById('share-body').innerHTML = isImg
    ? `<img src="${f.url}" alt="${f.filename}">`
    : `<div class="share-pdf-icon">📄<div style="font-size:13px;color:#333;margin-top:6px">${f.filename}</div></div>`;
  document.getElementById('share-hint').textContent = isImg ? t('shareHintImg') : t('shareHintPdf');
  /* Web Share（含檔案）：iOS 15+ Safari／Chrome、Android Chrome 皆支援 → 分享面板有「儲存影像」 */
  const file = new File([f.blob], f.filename, { type: f.blob.type });
  const canShare = !!(navigator.canShare && navigator.share && navigator.canShare({ files: [file] }));
  shareFile.file = file;
  const bShare = document.getElementById('share-btn-share');
  const bDl = document.getElementById('share-btn-dl');
  bShare.hidden = !canShare;
  /* iOS：系統分享面板內有「儲存影像／儲存到檔案」→ 只留分享鈕（不支援分享的舊 iOS 才顯示下載）
     Android：分享面板只能分享、存檔要靠下載 → 下載為主鈕、分享僅標「分享」 */
  bDl.hidden = IS_IOS && canShare;
  bShare.textContent = IS_IOS ? (isImg ? t('shareBtn') : t('shareBtnPdf')) : t('shareOnly');
  bDl.textContent = t('dlBtn');
  bShare.className = 'share-btn ' + (IS_IOS ? 'share-btn-primary' : 'share-btn-secondary');
  bDl.className = 'share-btn ' + (IS_IOS ? 'share-btn-secondary' : 'share-btn-primary');
  bShare.style.order = IS_IOS ? 0 : 1;
  bDl.style.order = IS_IOS ? 1 : 0;
  document.getElementById('share-modal').hidden = false;
}
function closeShareModal() {
  const m = document.getElementById('share-modal');
  if (m) m.hidden = true;
  if (shareFile) { const u = shareFile.url; setTimeout(() => URL.revokeObjectURL(u), 60000); }
  shareFile = null;
}
/* 按鈕都在「新的使用者手勢」內執行 → 不會因產生檔案耗時而被擋 */
async function shareModalShare() {
  if (!shareFile) return;
  try { await navigator.share({ files: [shareFile.file], title: shareFile.filename }); }
  catch (e) { if (e && e.name !== 'AbortError') { console.warn('share failed, fallback to download:', e); shareModalDownload(); } }
}
function shareModalDownload() {
  if (shareFile) triggerDownload(shareFile.url, shareFile.filename);
}

/* App 內建瀏覽器提示：LINE 支援 ?openExternalBrowser=1 直接跳外部瀏覽器 */
function updateInAppBar() {
  const bar = document.getElementById('inapp-bar');
  if (!bar) return;
  bar.hidden = !IS_INAPP;
  if (!IS_INAPP) return;
  document.getElementById('inapp-hint').textContent = t('inappHint');
  const a = document.getElementById('inapp-open');
  a.textContent = t('inappOpen');
  const u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1');
  a.href = u.toString();
}

function withExportBusy(fn) {
  const btns = [...document.querySelectorAll('.nav-btn, .btn-export-main')];
  btns.forEach(b => { b.dataset.orig = b.innerHTML; b.innerHTML = t('generating'); b.disabled = true; });
  return fn().finally(() => btns.forEach(b => { b.innerHTML = b.dataset.orig; b.disabled = false; }));
}

async function exportPDF() {
  return withExportBusy(async () => {
    try {
      const canvas = await generateCanvas();
      const { jsPDF } = window.jspdf;
      const land = isLandscape();
      const pdf = new jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
      const [pw, ph] = land ? [297, 210] : [210, 297];
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, ph);
      deliverFile(pdf.output('blob'), "O'right PRO DM.pdf", 'pdf');
    } catch (e) {
      console.error('PDF export failed:', e);
      alert(t('pdfFail'));
    }
  });
}

async function exportJPG() {
  return withExportBusy(async () => {
    try {
      const canvas = await generateCanvas();
      const blob = await canvasToBlob(canvas, 'image/jpeg', 0.95);
      deliverFile(blob, "O'right PRO DM.jpg", 'jpg');
    } catch (e) {
      console.error('JPG export failed:', e);
      alert(t('jpgFail'));
    }
  });
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
/* DOMContentLoaded 即初始化（不等整頁資源），loading 動態只等預覽畫布內的圖片。
   重新整理（F5）＝完整重設：一律回到預設（直式・四格），不還原上次編輯。 */
window.addEventListener('DOMContentLoaded', () => {
  // 以 Excel 文案套用初始預設（標題/用途/原價加總/定價＝原價或 5000）
  state.four.forEach(applyMainCopy);
  state.two.forEach(applyTwoMeta);
  state.one[0].products.forEach(setProductUsage);
  applyOneMeta();
  buildBgPicker();
  const edScroll = document.querySelector('.editor-scroll');
  if (edScroll) edScroll.addEventListener('scroll', () => closeBgDropdown(), { passive: true });
  buildEditorBlocks();
  renderDM();
  scaleSheet();
  hidePreviewLoading();
  updateInAppBar();
});
window.addEventListener('resize', scaleSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShareModal(); });

/* 畫布圖片（底圖／產品圖）載入完成後移除 loading；最多等 5 秒保底 */
function hidePreviewLoading() {
  const el = document.getElementById('preview-loading');
  if (!el) return;
  const done = () => {
    el.classList.add('hide');
    // 保底：淡出後強制移除（背景分頁 CSS transition 可能不前進，避免卡住不消失）
    setTimeout(() => { el.style.display = 'none'; }, 400);
  };
  const imgs = [...document.querySelectorAll('#dm-sheet img')];
  const pending = imgs.filter(i => !(i.complete && i.naturalWidth));
  if (!pending.length) { done(); return; }
  let left = pending.length;
  const tick = () => { if (--left <= 0) done(); };
  pending.forEach(i => { i.addEventListener('load', tick, { once: true }); i.addEventListener('error', tick, { once: true }); });
  setTimeout(done, 5000);
}
