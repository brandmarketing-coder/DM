<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'right PRO | DM 編輯器</title>
<!-- 流程版面的細體數字（步驟編號／價格）：只取數字與 $ 子集，約 2KB；載不到則退回系統字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200&text=0123456789%24.%2C&display=swap">
<!-- 匯出用函式庫（html2canvas / jsPDF）改為匯出時才載入，加快初始載入：見 ensureExportLibs() -->
<!-- 商品清單與產品文案（由 tools/build-copy.mjs 從 產品圖片/ 與 產品文案 CSV 自動產生） -->
<!-- ?v= 版本號由 build-copy.mjs／build-names.mjs 於重建時自動更新，避免瀏覽器載到舊快取 -->
<script src="products.js?v=1793362288112"></script>
<script src="product-copy.js?v=1793362288112"></script>
<script src="i18n.js?v=1793362288112"></script>
<script src="names-en.js?v=1793362288112"></script>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', '微軟正黑體', 'Microsoft JhengHei', sans-serif;
  background: #e2e0dc; height: 100vh; overflow: hidden; color: #333;
}

/* ── Navbar ── */
.navbar {
  height: 52px; background: #1c1c1c; color: white;
  display: flex; align-items: center; padding: 0 20px; gap: 10px;
  flex-shrink: 0; user-select: none;
}
.nav-logo { font-size: 14px; letter-spacing: 1px; color: white; font-weight: 400; display: flex; align-items: center; gap: 4px; }
.nav-logo .dot { width: 9px; height: 9px; background: #7ec850; border-radius: 50%; }
.nav-logo-img { height: 32px; width: auto; display: block; }
.nav-title { font-size: 13px; color: #888; font-weight: 300; }
.nav-spacer { flex: 1; }
.nav-btn {
  padding: 6px 14px; border-radius: 6px; cursor: pointer; border: none;
  font-size: 12px; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 5px; transition: background 0.15s;
}
.nav-btn-export { background: #3a7d44; color: white; }
.nav-btn-export:hover { background: #2d6235; }
.nav-btn-export-jpg { background: #5c8f52; color: white; }
.nav-btn-export-jpg:hover { background: #4b7543; }
.nav-btn-preview { background: transparent; color: #bbb; border: 1px solid #444; }
.nav-btn-preview:hover { border-color: #888; color: white; }

/* ── Language picker ── */
.lang-pick { display: flex; gap: 2px; margin-right: 8px; background: #2a2a2a; border-radius: 6px; padding: 2px; }
.lang-btn {
  border: none; background: transparent; color: #999; cursor: pointer;
  font-size: 12px; padding: 5px 10px; border-radius: 4px; letter-spacing: 0.5px;
  transition: background 0.15s, color 0.15s;
}
.lang-btn:hover { color: #fff; }
.lang-btn.active { background: #3a7d44; color: #fff; }

/* ── Workspace ── */
.workspace { display: flex; height: calc(100vh - 52px); }

/* ── Preview Pane ── */
.preview-pane { flex: 1; background: #d0cdc9; position: relative; overflow: hidden; }

/* ── DM Sheet wrapper: absolutely centred ── */
.dm-wrap {
  position: absolute; top: 50%; left: 50%;
  transform-origin: center center; /* transform set by JS */
}

/* ══════════════════════════════════════════
   DM SHEET  (A4: 595 × 842 px)
══════════════════════════════════════════ */
#dm-sheet {
  width: 595px; height: 842px;
  display: flex; flex-direction: column;
  background: white;
  box-shadow: 0 8px 40px rgba(0,0,0,0.28);
  overflow: hidden; /* hard clip — no scrollbars ever */
}

/* Header / Footer images */
.dm-hdr, .dm-ftr { flex-shrink: 0; line-height: 0; width: 100%; }
.dm-hdr img, .dm-ftr img { width: 100%; display: block; }

/* Content zone */
.dm-content { flex: 1; min-height: 0; display: flex; flex-direction: column; background: white; overflow: hidden; }

/* Tagline */
.dm-tagline {
  flex-shrink: 0;
  text-align: center; padding: 11px 24px 5px;
  font-size: 16px; letter-spacing: 4px; color: #666; font-weight: 300;
}
.dm-subtitle {
  flex-shrink: 0;
  text-align: center; padding: 0 24px 8px;
  font-size: 18pt; letter-spacing: 1px; color: #666; font-weight: 300;
  line-height: 1.35;
}

/* ══════════════════════════════════════════
   FOUR-GRID  (2 × 2 independent cells)
══════════════════════════════════════════ */
.dm-four-grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  padding: 2px 6px 6px;
}

.dm-cell {
  display: flex; flex-direction: column;
  padding: 8px 12px 8px;
  min-height: 0; overflow: hidden;
}
/* inner borders */
.dm-cell:nth-child(1),
.dm-cell:nth-child(3) { border-right: 1px solid #dedad6; }
.dm-cell:nth-child(1),
.dm-cell:nth-child(2) { border-bottom: 1px solid #dedad6; }

/* Image area — fixed height so text is never squeezed out */
.dm-cell-imgs {
  height: 130px; flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 4px; overflow: hidden;
}
.dm-cell-img-slot {
  min-width: 0;
  display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  height: 100%;
}
.dm-cell-img-slot img {
  max-width: 100%; max-height: 100%; object-fit: contain; display: block;
}
.dm-cell-img-slot.is-main { flex: 0 0 80px; }
.dm-cell-img-slot.is-gift  { flex: 0 0 50px; }
.dm-cell-img-slot.is-main:only-child { flex: 0 0 auto; max-width: 110px; }

/* Cell text */
.dm-cell-text { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 4px; }
/* 文字列不可壓縮：品名過長時真正溢出以觸發自動縮放，而非把標語壓成 0（否則標語看似消失） */
.dm-cell-text > * { flex-shrink: 0; }
.dm-cell-headline { font-size: 16px; font-weight: 400; color: #1a1a1a; line-height: 1.35; margin-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dm-cell-names { font-size: 16px; color: #999; line-height: 1.5; margin-bottom: 3px; word-break: break-word; }
.dm-cell-gift-name { color: #c0bbb5; }
.dm-cell-price-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.dm-cell-price     { font-size: 22px; font-weight: 400; color: #1a1a1a; letter-spacing: 0.3px; }
.dm-cell-unit      { font-size: 16px; color: #555; }
.dm-cell-orig      { font-size: 16px; color: #b5afa8; }

/* ══════════════════════════════════════════
   TWO-GRID  (2 stacked bundles)
══════════════════════════════════════════ */
.dm-two-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.dm-bundle-row {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 8px 28px 10px; overflow: hidden;
}
.dm-bundle-row + .dm-bundle-row { border-top: 1px solid #dedad6; }

/* Products — each product is a column: image above, name below, bottoms aligned */
.dm-bundle-pair {
  flex: 1; min-height: 0;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 20px; overflow: hidden; padding-bottom: 2px;
}
.dm-bprod { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.dm-bprod-img {
  display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
}
.dm-bprod-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
/* 贈品標籤：高度由 padding 撐出（不用固定 height）→ 縮放時高度隨字級等比例，永遠是膠囊不會壓扁 */
.dm-gift-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px; background: #19322F; color: white;
  padding: 5px 11px;
  border-radius: 999px; margin-bottom: 14px;
  letter-spacing: 1px; font-style: normal; line-height: 1;
}
/* 標籤文字清空：隱藏但保留佔位空間 → 版面完全不動 */
.dm-gift-badge.is-hidden { visibility: hidden; }
.dm-bprod-name {
  font-size: 16px; color: #8d8d8d; text-align: center;
  margin-top: 5px; line-height: 1.3;
  max-width: 100%; word-break: break-word;
}
/* Two-grid image sizes: gift ~2/3 height of main, bottoms align via flex-end on parent */
.dm-bundle-pair .dm-bprod.is-main .dm-bprod-img { width: 128px; height: 165px; }
.dm-bundle-pair .dm-bprod.is-gift .dm-bprod-img  { width: 85px;  height: 111px; }
/* 單一商品：高度同主商品以免超出容器被裁切，寬度略大維持存在感 */
.dm-bundle-pair .dm-bprod.is-main:only-child .dm-bprod-img { width: 134px; height: 165px; }
/* 直式：內容寬欄＋整體置中（兩商品不會分太開），品名於各商品圖下方置中換行；
   品名寬度貼近圖寬（略寬 8px），長品名換行、不撐開欄距 */
.dm-bundle-pair .dm-bprod { flex: 0 1 auto; min-width: 0; max-width: 44%; }
.dm-bundle-pair .dm-bprod-name { max-width: 136px; }
.dm-bundle-pair .dm-bprod.is-gift .dm-bprod-name { max-width: 118px; }
.dm-bundle-pair.has-3 .dm-bprod { max-width: 31%; }
.dm-bundle-pair.has-3 .dm-bprod-name { max-width: 114px; }
.dm-bundle-pair.has-3 .dm-bprod.is-gift .dm-bprod-name { max-width: 100px; }
/* 品名固定 2 行高 → 各欄品名起始線一致、商品圖底部對齊 */
.dm-bundle-pair .dm-bprod-name { min-height: 2.6em; }
/* 三商品：圖縮小一級、間距縮小 */
.dm-bundle-pair.has-3 { gap: 12px; }
.dm-bundle-pair.has-3 .dm-bprod.is-main .dm-bprod-img { width: 106px; height: 137px; }
.dm-bundle-pair.has-3 .dm-bprod.is-gift .dm-bprod-img { width: 72px; height: 94px; }

/* 用途說明（產品描述）：直式兩格，置中於商品與售價之間 */
.dm-bundle-desc {
  flex-shrink: 0; font-size: 16px; line-height: 1.5; color: #6f6f6f;
  text-align: center; max-width: 92%; margin: 3px auto 0; white-space: pre-line;
}
/* 橫式1 兩格：白框小、用途說明較直式縮小 */
#dm-sheet.bg-h1 .dm-bundle-desc { font-size: 12.5px; }

/* ── 外文（EN/PL）視覺平衡 ──
   官方英文品名長且全大寫：窄欄下單字被硬切斷、品名疊成高塔。
   外文改為品名整行置中於商品圖下（主商品一行＋贈品一行），並禁止單字中斷。 */
.dm-bundle-names {
  flex-shrink: 0; text-align: center; font-size: 16px; color: #8d8d8d;
  line-height: 1.4; margin: 6px auto 0; max-width: 96%;
  word-break: normal; overflow-wrap: break-word;
}
.dm-bundle-names .dm-gift-line { color: #b3ada7; }
#dm-sheet.is-landscape .dm-bundle-names { font-size: 16px; margin-top: 4px; }
/* 橫式左右兩欄：品名區固定兩行高 → 兩欄的描述/售價起始線一致 */
#dm-sheet.is-landscape .dm-bundle-names { min-height: 2.9em; }
/* 外文：所有品名禁止單字中斷（僅超長單字才折行） */
#dm-sheet.lang-latin .dm-bprod-name,
#dm-sheet.lang-latin .dm-cell-names,
#dm-sheet.lang-latin .dm-one-namecell,
#dm-sheet.lang-latin .dm-feature-name { word-break: normal; overflow-wrap: break-word; }
/* 外文一格：品名整體縮小（全大寫官方名視覺較大、且較長） */
#dm-sheet.lang-latin .dm-one-pair .dm-bprod-name { font-size: 15px; }
#dm-sheet.lang-latin.is-landscape .dm-one-namecell { font-size: 15px; }
#dm-sheet.lang-latin .dm-one-pair.has-3-prods .dm-bprod-name { font-size: 16px; }
#dm-sheet.lang-latin.is-landscape .dm-one-pair.has-3-prods .dm-one-namecell { font-size: 16px; }
/* 外文特寫（無贈品）：單行品名字級略縮 */
#dm-sheet.lang-latin.is-landscape .dm-feature-name { font-size: 16px; }

/* Bundle price */
.dm-bundle-price-row {
  flex-shrink: 0; display: flex; align-items: baseline;
  gap: 8px; flex-wrap: wrap; padding-top: 5px;
  justify-content: center;
}
.dm-headline-lbl { font-size: 18px; color: #555; letter-spacing: 0.5px; text-align: center;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
/* 售價數字＋單位永遠成組（直式維持單行；橫式可整組獨立成一行） */
.dm-price-grp   { display: inline-flex; align-items: baseline; gap: 4px; }
.dm-price-num   { font-size: 32px; font-weight: 400; color: #1a1a1a; letter-spacing: 0.3px; }
.dm-price-unit  { font-size: 18px; color: #444; }
.dm-orig-price  { font-size: 16px; color: #b5afa8; }

/* ══════════════════════════════════════════
   ONE-GRID  (single centred product)
══════════════════════════════════════════ */
.dm-one-block {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 10px 36px 14px; overflow: hidden;
}

/* One-grid pair: 每個商品為等寬欄（與下方用途欄對齊），圖置中、底部對齊 */
.dm-one-pair {
  flex-shrink: 0; width: 100%;
  display: flex; align-items: flex-end; justify-content: center;
  gap: var(--colGap, 24px); overflow: hidden;
}
.dm-one-pair > .dm-bprod { flex: 1 1 0; min-width: 0; }
/* 圖片尺寸乘上 --imgScale（預設 1），供自動縮放避免長用途文字爆版 */
.dm-one-pair .dm-bprod.is-main .dm-bprod-img  { width: calc(170px * var(--imgScale, 1)); height: calc(240px * var(--imgScale, 1)); }
.dm-one-pair .dm-bprod.is-gift .dm-bprod-img   { width: calc(115px * var(--imgScale, 1)); height: calc(161px * var(--imgScale, 1)); }
.dm-one-pair .dm-bprod.is-main:only-child .dm-bprod-img { width: calc(195px * var(--imgScale, 1)); height: calc(275px * var(--imgScale, 1)); }
.dm-one-pair .dm-bprod-name { font-size: 20px; }

/* Styling adjustments when there are 3 products in one-grid layout（欄距改由 --colGap 控制） */
.dm-one-pair.has-3-prods .dm-bprod.is-main .dm-bprod-img {
  width: calc(155px * var(--imgScale, 1));
  height: calc(220px * var(--imgScale, 1));
}
.dm-one-pair.has-3-prods .dm-bprod.is-gift .dm-bprod-img {
  width: calc(105px * var(--imgScale, 1));
  height: calc(148px * var(--imgScale, 1));
}
.dm-one-pair.has-3-prods .dm-bprod-name {
  font-size: 16px;
}
.dm-one-pair.has-3-prods .dm-gift-badge {
  font-size: 15px;
  padding: 5.5px 12px;
  margin-bottom: 10px;
}

/* 一格「用途說明」：左右分欄（幾個商品幾欄）；主管指定 8~10pt，--usageFS 由自動縮放調整 */
.dm-one-usage {
  flex-shrink: 0; width: 100%;
  display: flex; justify-content: center; align-items: flex-start; gap: var(--colGap, 24px);
  font-size: var(--usageFS, 11pt); line-height: 1.55; color: #6f6f6f;
  padding: 8px 0 0;   /* 不加左右內距，使用途欄寬與上方商品欄完全一致 */
}
/* 每欄與上方商品同寬；用途文字區塊靠各欄左界對齊（兩段文字左邊緣一致 → 整齊兩欄、不歪）
   區塊本身為內容寬（最長行）故香調等短行不被強制換行，僅長段落於欄寬處自動換行 */
.dm-one-usage-col { flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-start; }
.dm-one-usage-col:only-child { flex: 0 1 460px; justify-content: center; }
.dm-one-usage-text { display: inline-block; max-width: 100%; text-align: left; white-space: pre-line; }

.dm-one-price-row {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 10px; gap: 5px;
}
.dm-one-price-main {
  display: flex; align-items: baseline;
  gap: 8px; flex-wrap: wrap; justify-content: center;
}
/* 一格標題／促銷標語：獨立一行、置中、可換行；字級由自動縮放控制（--headlineFS） */
.dm-one-headline {
  flex-shrink: 0; width: 100%;
  font-size: var(--headlineFS, 24px); font-weight: 500; color: #555;
  text-align: center; line-height: 1.3; padding: 6px 18px 0; word-break: break-word;
}

/* One-grid specific text overrides to make them really stand out */
.is-two-grid .dm-tagline { font-size: 23pt; }
.is-one-grid .dm-tagline { font-size: 31pt; font-weight: 300; padding: 18px 24px 10px; }
.dm-one-pair .dm-gift-badge {
  font-size: 22px;
  padding: 8px 18px;
  margin-bottom: 18px;
}
.dm-one-block .dm-price-num { font-size: 42px; font-weight: 500; }
.dm-one-block .dm-price-unit { font-size: 22px; }
.dm-one-block .dm-orig-price { font-size: 15px; }

/* ══════════════════════════════════════════
   EDITOR PANE
══════════════════════════════════════════ */
.editor-pane {
  width: 390px; flex-shrink: 0;
  background: white; border-left: 1px solid #d0cdc9;
  display: flex; flex-direction: column; overflow: hidden;
}
.editor-scroll { flex: 1; overflow-y: auto; }
.editor-sec { padding: 14px 14px 12px; border-bottom: 1px solid #eee; }
.editor-sec-num { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 12px; }

/* 預覽畫布載入動態（畫布就緒前顯示，載入完成後淡出移除） */
.preview-loading {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: #d0cdc9; color: #888; font-size: 13px; letter-spacing: 1px;
  transition: opacity 0.35s ease;
}
.preview-loading.hide { opacity: 0; pointer-events: none; }

/* ── 匯出結果視窗（手機／內建瀏覽器用）──
   iOS WebKit（Safari／Chrome／LINE 皆同核心）對 <a download> 支援不穩，
   改以：長按圖片存相簿 ＋ Web Share（系統分享→儲存影像）＋ 一般下載 三條路徑。 */
.share-modal {
  position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 16px;
  background: rgba(20, 20, 20, 0.92); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.share-modal[hidden] { display: none; }
.share-card {
  width: 100%; max-width: 420px; max-height: 100%; display: flex; flex-direction: column;
  background: #fff; border-radius: 14px; overflow: hidden;
}
.share-head { padding: 12px 16px; font-size: 14px; font-weight: 600; color: #222; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.share-close { border: none; background: none; font-size: 20px; line-height: 1; color: #888; cursor: pointer; padding: 4px 6px; }
.share-body { flex: 1; min-height: 0; overflow: auto; background: #e9e6e2; display: flex; align-items: center; justify-content: center; padding: 12px; }
.share-body img { max-width: 100%; max-height: 52vh; object-fit: contain; box-shadow: 0 2px 12px rgba(0,0,0,0.25); -webkit-touch-callout: default; }
.share-body .share-pdf-icon { font-size: 56px; color: #3a7d44; padding: 24px 0; }
.share-hint { font-size: 12px; color: #555; text-align: center; padding: 10px 16px 0; line-height: 1.5; }
.share-actions { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; }
.share-btn {
  width: 100%; padding: 13px; border-radius: 8px; border: none; font-size: 14px; letter-spacing: 0.5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.share-btn-primary { background: #3a7d44; color: #fff; }
.share-btn-secondary { background: #f0eeeb; color: #333; }
.share-btn[hidden] { display: none; }

/* LINE／FB／IG 內建瀏覽器提示條 */
.inapp-bar {
  background: #fff4d6; color: #5a4300; font-size: 12px; line-height: 1.5;
  padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: center;
}
.inapp-bar[hidden] { display: none; }
.inapp-bar a { color: #fff; background: #3a7d44; text-decoration: none; padding: 4px 12px; border-radius: 6px; font-weight: 600; }
.loading-spin {
  width: 34px; height: 34px; border: 3px solid #bdb9b3; border-top-color: #3a7d44;
  border-radius: 50%; animation: ed-spin 0.8s linear infinite;
}
@keyframes ed-spin { to { transform: rotate(360deg); } }

/* Layout picker */
.layout-pick { display: flex; gap: 8px; }
.layout-opt {
  flex: 1; border: 2px solid #e2e2e2; border-radius: 8px;
  padding: 9px 6px; cursor: pointer; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.layout-opt:hover { border-color: #5aaa6a; }
.layout-opt.active { border-color: #3a7d44; background: #f0f7f1; }
.lt-thumb {
  width: 46px; height: 56px; margin: 0 auto 6px;
  background: #ddd; display: grid; gap: 2px; padding: 4px; border-radius: 2px;
}
.lt-thumb.lt4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.lt-thumb.lt2 { grid-template-columns: 1fr;     grid-template-rows: 1fr 1fr; }
.lt-thumb.lt1 { grid-template-columns: 1fr;     grid-template-rows: 1fr; }
.lt-thumb > div { background: white; border-radius: 1px; }
.lt-label { font-size: 12px; color: #666; }
.layout-opt.active .lt-label { color: #3a7d44; font-weight: 600; }

/* Fields */
.field-lbl { font-size: 10.5px; color: #888; margin-bottom: 3px; display: block; }
.field-input {
  width: 100%; padding: 6px 9px; border: 1px solid #ddd; border-radius: 5px;
  font-size: 12px; color: #333; outline: none; background: #fafafa;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: #5aaa6a; background: white; }

/* Block editor */
.block-ed {
  background: #f8f7f5; border-radius: 7px; padding: 10px 10px 9px;
  margin-top: 10px; border: 1px solid #ede9e5;
}
.block-ed-title { font-size: 10.5px; font-weight: 700; color: #555; margin-bottom: 9px; }

.prod-pair { display: flex; gap: 7px; margin-bottom: 8px; }
.prod-slot { flex: 1; min-width: 0; }
.prod-slot-lbl { font-size: 9.5px; color: #aaa; margin-bottom: 3px; }
.prod-thumb-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
.prod-thumb {
  width: 30px; height: 30px; object-fit: contain;
  border: 1px solid #e5e5e5; border-radius: 4px; background: #f5f5f5; flex-shrink: 0;
}
.prod-sel {
  width: 100%; padding: 5px 7px; border: 1px solid #ddd; border-radius: 4px;
  font-size: 11px; color: #333; background: white; outline: none;
}
.prod-sel:focus { border-color: #5aaa6a; }

.price-pair { display: flex; gap: 7px; margin-top: 2px; }
.price-slot { flex: 1; }
.price-slot label { font-size: 9.5px; color: #aaa; display: block; margin-bottom: 2px; }
.price-input {
  width: 100%; padding: 5px 7px; border: 1px solid #ddd; border-radius: 4px;
  font-size: 12px; outline: none; background: #fafafa;
}
.price-input:focus { border-color: #5aaa6a; background: white; }

.headline-field { margin-bottom: 7px; }

/* Export */
.editor-footer { flex-shrink: 0; }
.btn-export-main {
  display: block; width: 100%; padding: 14px;
  background: #3a7d44; color: white; border: none;
  font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: background 0.15s;
}
.btn-export-main:hover { background: #2d6235; }
.export-note { font-size: 9.5px; color: #bbb; text-align: center; padding: 6px 10px; }

/* ── Responsive ── */

/* Medium: tablet landscape / small laptop — keep side-by-side, narrow editor */
@media (max-width: 960px) {
  .editor-pane { width: 300px; }
  .block-ed { padding: 8px 8px 7px; }
}

/* Small: tablet portrait / mobile — stack vertically, page scrolls */
@media (max-width: 700px) {
  body { height: auto; overflow: auto; }

  /* Navbar：手機精簡（小 logo、小按鈕、緊湊兩行） */
  .navbar { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 5px; row-gap: 5px; }
  .nav-spacer { display: none; }
  .nav-title { display: none; }
  .navbar > span { display: none; }                 /* logo 後的分隔線 */
  .nav-logo-img { height: 20px; }
  .nav-btn { padding: 4px 9px; font-size: 11px; border-radius: 5px; gap: 4px; }
  .nav-btn svg { width: 10px; height: 10px; }
  .lang-pick { margin-right: 0; padding: 1px; }
  .lang-btn { padding: 3px 8px; font-size: 11px; }

  /* Stack preview above editor */
  .workspace { flex-direction: column; height: auto; overflow: visible; }

  /* Preview: fixed height so the scaled A4 always shows */
  .preview-pane { flex: none; height: 380px; min-height: 0; }

  /* Editor: full width, flows in document */
  .editor-pane {
    width: 100%; height: auto;
    border-left: none; border-top: 1px solid #d0cdc9;
    overflow: visible; flex-shrink: 0;
  }
  .editor-scroll { overflow-y: visible; height: auto; }

  /* Product selector pair: stack vertically so dropdowns are full width */
  .prod-pair { flex-direction: column; gap: 6px; }
  .prod-sel { font-size: 11px; }

  /* Layout picker: stay horizontal, allow small size */
  .lt-thumb { width: 36px; height: 44px; }
  .lt-label { font-size: 11px; }
}

/* ══════════════════════════════════════════
   LANDSCAPE SHEET  (A4 horizontal: 842 × 595 px)
══════════════════════════════════════════ */
#dm-sheet.is-landscape {
  width: 842px; height: 595px;
  position: relative; /* absolute 子元素的定位基準 */
}
.dm-bg-full {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; object-fit: fill;
  z-index: 0; pointer-events: none;
}
/* 橫式：內容區背景透明（白底已由底圖提供），避免白框邊緣溢出綠底 */
#dm-sheet.is-landscape .dm-content { background: transparent; }
/* 直式滿版底圖（2026大促 p2）：絕對定位基準＋內容區透明 */
#dm-sheet.bg-p2, #dm-sheet.bg-p3 { position: relative; }
#dm-sheet.bg-p2 .dm-content, #dm-sheet.bg-p3 .dm-content { background: transparent; }

/* ══ 流程版面（直式 3 專用）：步驟膠囊＋連接箭頭／商品圖／品名＋說明；底部價格列＋QR ══
   座標皆為 595×842 頁面上的絕對像素（renderFlow 依步驟數算列高，免量測）。 */
.dm-flow { position: absolute; inset: 0; color: #333; }
.flow-steps { position: absolute; left: 0; right: 0; top: 244px; height: 510px; display: flex; flex-direction: column; }
/* 列高＝內容高＋平分剩餘空間：內容相近時等距；某步說明較長時向其他列借空間 */
.flow-row { display: flex; align-items: stretch; flex: 1 1 auto; min-height: 0; }
.flow-left {
  width: 187px; flex-shrink: 0; padding-left: 47px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
}
.flow-conn { flex: 1; min-height: 6px; width: 1px; background: #6b6b6b; position: relative; }
.flow-conn.is-top { margin-bottom: 9px; }
.flow-conn.is-bottom { margin-top: 9px; }
.flow-conn.is-blank { background: transparent; }
.flow-conn .flow-arrow { position: absolute; left: -3px; bottom: -1px; width: 7px; height: 5px; display: block; }
.flow-pill {
  position: relative; flex-shrink: 0; width: 96px; box-sizing: border-box;
  min-height: 34px; padding: 11px 6px 9px; border: 1px solid #3c3c3c; border-radius: 17px;
  display: flex; align-items: center; justify-content: center;
}
.flow-label {
  font-size: 15px; line-height: 1.3; letter-spacing: 1px; color: #333;
  text-align: center; white-space: pre-line; word-break: break-word;
}
/* 步驟編號壓在框線上：line-height 0.8 讓底色塊只包住數字本身（不含字型下方留白），
   底色塊下緣約在框線下 9px；膠囊上內距 11px → 第一行字從色塊下方開始，不被遮住 */
.flow-num {
  position: absolute; left: 13px; top: -19px;
  font-family: 'Jost', 'Helvetica Neue', 'Segoe UI', sans-serif; font-weight: 200;
  font-size: 34px; line-height: 0.8; color: #8C7651; background: #EFF1EE; padding: 0 3px;
}
.flow-main {
  flex: 1; min-width: 0; margin-right: 54px;
  display: flex; align-items: center;
}
.flow-main.has-sep { border-top: 1px solid #9b9b9b; }
.flow-imgs { min-width: 92px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 4px; box-sizing: border-box; }
.flow-imgs img { display: block; width: auto; max-width: 100px; object-fit: contain; }
.flow-text { flex: 1; min-width: 0; padding-left: 8px; }
.flow-name { font-size: 15px; font-weight: 400; letter-spacing: 1px; color: #19322F; margin-bottom: 6px; line-height: 1.4; }
.flow-desc { font-size: 12.5px; letter-spacing: 0.5px; color: #666; line-height: 1.65; white-space: pre-line; }
.lang-latin .flow-name, .lang-latin .flow-desc, .lang-latin .flow-label { letter-spacing: 0; }

/* 價格列：線──》標語 $價格《──線（箭頭隨文字長度移動）；線位於頁高 94.5% */
.flow-price { position: absolute; left: 0; right: 0; top: 796px; transform: translateY(-50%); display: flex; align-items: center; }
.flow-line { flex: 1; height: 1px; background: #8C7651; }
.flow-chev { width: 15px; height: 9px; display: block; margin: 0 9px; flex-shrink: 0; }
.flow-price-group { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
.flow-price-label { font-size: 14px; letter-spacing: 1.5px; color: #8C7651; }
.flow-price-num {
  font-family: 'Jost', 'Helvetica Neue', 'Segoe UI', sans-serif; font-weight: 200;
  font-size: 38px; line-height: 1; color: #8C7651; letter-spacing: 0.5px;
}
.flow-price-unit { font-size: 16px; color: #8C7651; }
/* QR：蓋在價格線右段上（底色遮住線） */
.flow-qr {
  position: absolute; right: 18px; bottom: 16px; min-width: 60px; box-sizing: border-box;
  padding: 3px 4px 4px; background: #EFF1EE; text-align: center;
  display: flex; flex-direction: column; align-items: center;
}
.flow-qr-label { font-size: 12px; line-height: 1.2; color: #8C7651; letter-spacing: 0.5px; margin-bottom: 3px; white-space: nowrap; }
.flow-qr img { display: block; width: 52px; height: 52px; object-fit: contain; }
.flow-qr .flow-qr-wait { width: 52px; height: 52px; background: repeating-linear-gradient(45deg, #ddd 0 4px, #e9e9e9 4px 8px); }

/* 編輯區：流程步驟卡片 */
.flow-step-ed { background: #fdfdfd; border: 1px solid #e2e2e2; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.flow-step-no { font-size: 11px; color: #555; }
/* 卡片標題列：左＝名稱，右＝工具圖示（排序在前、刪除以間隔分開，避免誤觸） */
.ed-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; min-height: 28px; }
.ed-card-tools { display: flex; align-items: center; gap: 4px; }
.ed-tools-sep { width: 1px; height: 18px; background: #e2e2e2; margin: 0 4px; }
/* 清單標題列：左＝欄位名，右＝新增圖示 */
.ed-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; min-height: 28px; }
.ed-list-head .field-lbl { margin-bottom: 0; }
.ic-btn {
  width: 28px; height: 28px; padding: 0; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid #dcdcdc; border-radius: 6px; background: #fff; color: #555;
  cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.ic-btn:hover:not(:disabled) { border-color: #5aaa6a; color: #2d6235; }
.ic-btn:disabled { opacity: 0.3; cursor: default; }
.ic-btn.is-add { border-color: #3a7d44; background: #3a7d44; color: #fff; }
.ic-btn.is-add:hover { background: #2d6235; border-color: #2d6235; color: #fff; }
.ic-btn.is-del { color: #b3261e; }
.ic-btn.is-del:hover:not(:disabled) { border-color: #e53e3e; background: #fff5f5; color: #c53030; }
@media (pointer: coarse) {
  .ic-btn { width: 34px; height: 34px; }
  .ed-card-head, .ed-list-head { min-height: 34px; }
  .ed-card-tools { gap: 6px; }
}
.flow-add {
  width: 100%; background: #3a7d44; color: white; border: none; padding: 9px; border-radius: 6px;
  font-size: 12px; cursor: pointer; font-weight: 600; margin-bottom: 12px; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.flow-add:hover { background: #2d6235; }
.flow-prod-line { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.flow-prod-line img { width: 32px; height: 32px; object-fit: contain; border: 1px solid #e5e5e5; border-radius: 4px; background: #f5f5f5; flex-shrink: 0; }
.flow-ed-field { margin-bottom: 8px; }
.flow-ed-field textarea.field-input { resize: vertical; line-height: 1.5; font-family: inherit; }
.qr-ed-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
.qr-ed-row img { width: 56px; height: 56px; object-fit: contain; border: 1px solid #e5e5e5; border-radius: 4px; background: #EFF1EE; }
.qr-file-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid #3a7d44; color: #3a7d44;
  border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; background: #fff;
}
.qr-file-btn:hover { background: #f1f7f2; }
.qr-file-btn input { display: none; }
/* .dm-land-content 的座標由 renderDM() 以 inline style 注入，
   方便 html2canvas proxy 複製 innerHTML 時保留定位資訊 */

/* 橫式：標題 18px／副標 14px（涵蓋 is-two-grid 24pt 與 is-one-grid 32pt 的放大設定） */
#dm-sheet.is-landscape .dm-tagline {
  font-size: 18px; letter-spacing: 2px; font-weight: 400;
  padding: 8px 20px 4px;
}
#dm-sheet.is-landscape .dm-subtitle {
  font-size: 16px; padding: 0 20px 6px; line-height: 1.3;
}

/* 橫式：致贈標籤改小（同時覆蓋 base 24px 與 one-pair 38px 的設定） */
#dm-sheet.is-landscape .dm-gift-badge {
  font-size: 12px; padding: 3.5px 9px;
  margin-bottom: 8px;
}

/* 橫式 1-grid：白框較小，縮減內距以爭取版面高度（搭配 fitOneGrid 自動縮放） */
#dm-sheet.is-landscape .dm-one-block { padding: 4px 16px 6px; }
#dm-sheet.is-landscape .dm-one-usage { padding-top: 4px; }
/* 一格售價文字縮小 5px（NT 數字 42→37、單位 22→17） */
#dm-sheet.is-landscape .dm-one-block .dm-price-num { font-size: 37px; }
#dm-sheet.is-landscape .dm-one-block .dm-price-unit { font-size: 17px; }

/* 橫式 4-grid：格子較矮，縮小圖片區與標題字級，避免有贈品時標題/品名被裁 */
#dm-sheet.is-landscape .dm-four-grid .dm-cell-imgs { height: 84px; }
#dm-sheet.is-landscape .dm-four-grid .dm-cell-headline { font-size: 16px; }
#dm-sheet.is-landscape .dm-four-grid .dm-cell-names { font-size: 16px; }
/* 四格標題與下方格子拉開一點點距離（僅橫式2、3 有四格） */
#dm-sheet.is-landscape .dm-four-grid { margin-top: 8px; }

/* 橫式 1-grid：圖片列／品名列分開（grid），圖片底部恆對齊、品名一行時不留空行 */
#dm-sheet.is-landscape .dm-one-pair {
  display: grid;
  grid-template-columns: repeat(var(--ncols, 2), 1fr);
  column-gap: var(--colGap, 24px);
  align-items: end; width: 100%; overflow: hidden;
}
#dm-sheet.is-landscape .dm-one-imgcell {
  min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
}
#dm-sheet.is-landscape .dm-one-namecell {
  min-width: 0; align-self: start; text-align: center;
  font-size: 19px; line-height: 1.3; padding-top: 5px; word-break: break-word; color: #999;
}
/* 橫式1 一格：品名放大至 20px、產品圖往下移一點點（空間不足由自動縮放處理） */
#dm-sheet.bg-h1 .dm-one-namecell { font-size: 20px; line-height: 1.2; }
#dm-sheet.bg-h1 .dm-one-pair { margin-top: 8px; }
/* 橫式一格：壓縮用途/售價區的垂直占用，讓 fitOneGrid 保留較大的產品圖 */
#dm-sheet.is-landscape .dm-one-usage { padding-top: 3px; line-height: 1.4; }
#dm-sheet.is-landscape .dm-one-headprice { padding-top: 4px; }
/* 圖片尺寸（沿用直式比例，乘 --imgScale 供自動縮放） */
#dm-sheet.is-landscape .dm-one-imgcell.is-main .dm-bprod-img { width: calc(170px * var(--imgScale,1)); height: calc(240px * var(--imgScale,1)); }
/* 贈品圖加大（其欄列高由較高的主圖決定，放大不增加垂直成本） */
#dm-sheet.is-landscape .dm-one-imgcell.is-gift .dm-bprod-img { width: calc(140px * var(--imgScale,1)); height: calc(197px * var(--imgScale,1)); }
#dm-sheet.is-landscape .dm-one-pair.has-1-prod .dm-one-imgcell.is-main .dm-bprod-img { width: calc(195px * var(--imgScale,1)); height: calc(275px * var(--imgScale,1)); }
#dm-sheet.is-landscape .dm-one-pair.has-3-prods .dm-one-imgcell.is-main .dm-bprod-img { width: calc(155px * var(--imgScale,1)); height: calc(220px * var(--imgScale,1)); }
#dm-sheet.is-landscape .dm-one-pair.has-3-prods .dm-one-imgcell.is-gift .dm-bprod-img { width: calc(105px * var(--imgScale,1)); height: calc(148px * var(--imgScale,1)); }
#dm-sheet.is-landscape .dm-one-pair.has-3-prods .dm-one-namecell { font-size: 16px; }

/* 橫式 1-grid：標題／促銷標語＋售價同一行；原價換行、右緣切齊售價「元」 */
#dm-sheet.is-landscape .dm-one-pricewrap {
  flex-shrink: 0; width: max-content; max-width: 100%; margin: 0 auto;
}
#dm-sheet.is-landscape .dm-one-headprice {
  display: flex; align-items: baseline; justify-content: center;
  gap: 14px; flex-wrap: nowrap; padding-top: 8px;
}
#dm-sheet.is-landscape .dm-one-headline-i {
  font-size: var(--headlineFS, 24px); font-weight: 500; color: #555; line-height: 1.3;
}
/* 橫式1 一格：標題／促銷標語較其他橫式放大 1px */
#dm-sheet.bg-h1 .dm-one-headline-i { font-size: calc(var(--headlineFS, 24px) + 1px); }
#dm-sheet.is-landscape .dm-one-origline {
  width: 100%; text-align: right; padding-top: 2px;
}

/* 橫式 2-grid：改為左右兩欄（分隔線由上下改為左右） */
#dm-sheet.is-landscape .dm-two-rows { flex-direction: row; }
/* 產品群組於欄位內垂直置中（不撐滿、改置中），兩欄結構相同故仍橫向對齊 */
#dm-sheet.is-landscape .dm-bundle-row { padding: 6px 14px 8px; justify-content: center; }
#dm-sheet.is-landscape .dm-bundle-pair { flex: 0 0 auto; }
#dm-sheet.is-landscape .dm-bundle-row + .dm-bundle-row {
  border-top: none; border-left: 1px solid #dedad6;
}
/* 兩格：標題／促銷標語、售價、原價 各自獨立成行（共三行、置中） */
#dm-sheet.is-landscape .dm-bundle-price-row {
  flex-direction: column; align-items: center; gap: 4px; flex-wrap: nowrap;
}
/* 橫式1：垂線縮短（取消整段 border，改用置中、約 80% 高的短分隔線） */
#dm-sheet.bg-h1 .dm-bundle-row + .dm-bundle-row { border-left: none; position: relative; }
#dm-sheet.bg-h1 .dm-bundle-row + .dm-bundle-row::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 1px; height: 80%; background: #dedad6;
}
/* 橫式1 兩格：標題文字往下移一點 */
#dm-sheet.bg-h1 .is-two-grid .dm-tagline { padding-top: 22px; }

/* 橫式2、3 兩格＝單品特寫：放大圖＋品名＋描述＋售價／原價（左右兩欄）。
   整個產品區塊垂直置中；圖片區與品名/描述皆固定高 → 兩欄區塊等高、置中後仍恆對齊（不一高一低）。 */
#dm-sheet.is-landscape .dm-feature-row {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 6px; padding: 10px 20px; overflow: hidden;
}
#dm-sheet.is-landscape .dm-feature-img {
  flex-shrink: 0; width: 145px; height: 195px;
  display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
}
#dm-sheet.is-landscape .dm-feature-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
#dm-sheet.is-landscape .dm-feature-name { flex-shrink: 0; font-size: 17px; color: #1a1a1a; font-weight: 400; line-height: 1.3; min-height: 2.6em; }
/* 描述保留約 3 行高 → 兩欄區塊等高，垂直置中後描述/售價仍對齊 */
#dm-sheet.is-landscape .dm-feature-desc { flex-shrink: 0; font-size: 16px; line-height: 1.5; color: #6f6f6f; max-width: 92%; min-height: 5em; }
#dm-sheet.is-landscape .dm-feature-price { flex-shrink: 0; padding-top: 4px; }
#dm-sheet.is-landscape .dm-feature-orig { flex-shrink: 0; }
/* 特寫模式有選贈品時：主圖＋贈品並排（主圖略縮、各自品名在圖下） */
#dm-sheet.is-landscape .dm-feature-imgs {
  flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; gap: 10px;
}
/* 欄寬 auto（＝圖寬，隨自動縮圖收縮），多商品並排不超出 */
#dm-sheet.is-landscape .dm-feature-main { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
#dm-sheet.is-landscape .dm-feature-gift { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
#dm-sheet.is-landscape .dm-feature-imgs { min-width: 0; max-width: 100%; }
#dm-sheet.is-landscape .dm-feature-img, #dm-sheet.is-landscape .dm-feature-gift .dm-bprod-img { max-width: 100%; }
#dm-sheet.is-landscape .dm-feature-row.has-gift .dm-feature-img { width: 108px; height: 146px; }
#dm-sheet.is-landscape .dm-feature-gift .dm-bprod-img {
  width: 70px; height: 95px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
}
#dm-sheet.is-landscape .dm-feature-main .dm-bprod-name,
#dm-sheet.is-landscape .dm-feature-gift .dm-bprod-name {
  font-size: 16px; color: #8d8d8d; text-align: center; line-height: 1.3; margin-top: 5px;
  max-width: 100%; word-break: break-word;
  min-height: 2.6em;   /* 固定品名高度→圖片區高度固定，兩欄描述/售價恆對齊（不受產品圖高低影響） */
}
/* 左右欄較窄：縮小商品圖與間距，使「主圖＋贈品」能並排不被裁切（以最窄的橫1為準） */
#dm-sheet.is-landscape .dm-bundle-pair { gap: 10px; }
/* 橫式：欄寬 auto（＝圖寬，隨自動縮圖收縮），品名用圖下整行（.dm-bundle-names） */
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod { flex: 0 1 auto; min-width: 0; max-width: 100%; }
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod-img { max-width: 100%; }
#dm-sheet.is-landscape .dm-bundle-pair.has-3 { gap: 6px; }
/* 贈品標籤：長標籤換行為多行膠囊，不撐寬欄位（高度隨行數） */
/* 橫式：長標籤可換行為多行膠囊（高度隨行數，不撐寬欄位） */
#dm-sheet.is-landscape .dm-gift-badge {
  max-width: 100%; white-space: normal;
  line-height: 1.2; text-align: center;
}
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod.is-main .dm-bprod-img { width: 88px; height: 114px; }
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod.is-gift .dm-bprod-img { width: 58px; height: 75px; }
/* 無贈品（單品）時放大主圖 */
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod.is-main:only-child .dm-bprod-img { width: 132px; height: 172px; }
/* 欄寬不再固定（品名已移至圖下整行）：欄寬＝圖寬，隨自動縮圖收縮，避免多商品並排超出 */
/* 品名固定 2 行高 → 兩欄品名起始線一致、主圖底部一致（與垂線水平對齊） */
#dm-sheet.is-landscape .dm-bundle-pair .dm-bprod-name {
  font-size: 16px; max-width: 100%; word-break: break-word;
  min-height: 32px;
}

/* ── BG picker ──
   觸控裝置：直式／橫式各一列，左右滑動（.bg-strips）
   有滑鼠的裝置：直式／橫式兩個下拉（.bg-dd-row），選項滑鼠移入顯示浮動預覽（.bg-preview） */
.bg-dd-row { display: none; gap: 8px; }
.bg-strips { display: flex; flex-direction: column; gap: 8px; }
@media (hover: hover) and (pointer: fine) {
  .bg-dd-row { display: flex; }
  .bg-strips { display: none; }
}

/* 縮圖：直式 210:297、橫式 297:210；直式公版以頁首＋白底＋頁尾組成 */
.bg-thumb { display: block; position: relative; overflow: hidden; background: #fff; flex-shrink: 0; }
.bg-thumb.o-p { aspect-ratio: 210 / 297; }
.bg-thumb.o-l { aspect-ratio: 297 / 210; }
.bg-thumb > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg-thumb.is-split > img { position: absolute; left: 0; width: 100%; height: auto; object-fit: initial; }
.bg-thumb.is-split > img.hdr { top: 0; }
.bg-thumb.is-split > img.ftr { bottom: 0; }

/* 觸控：兩列滑動 */
.bg-strip-row { display: flex; align-items: stretch; gap: 6px; }
.bg-strip-title {
  flex: 0 0 44px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #888; background: #f4f3f1; border-radius: 6px; text-align: center; line-height: 1.2;
}
.bg-strip {
  flex: 1; min-width: 0; display: flex; gap: 6px;
  overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 1px;
}
.bg-strip::-webkit-scrollbar { display: none; }
.bg-card {
  position: relative; flex: 0 0 auto; height: 64px; border: 2px solid #e2e2e2; border-radius: 7px;
  overflow: hidden; cursor: pointer; scroll-snap-align: start; padding: 0; background: #fff;
}
.bg-card .bg-thumb { height: 100%; }
.bg-card.active { border-color: #3a7d44; }
.bg-card-label {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 2px;
  font-size: 10px; line-height: 1.2; color: #fff; background: rgba(0,0,0,.55); text-align: center;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
}
.bg-card.active .bg-card-label { background: rgba(58,125,68,.92); font-weight: 600; }

/* 電腦：兩個下拉 */
.bg-dd { position: relative; flex: 1; min-width: 0; }
.bg-dd-btn {
  width: 100%; height: 34px; display: flex; align-items: center; gap: 7px;
  padding: 0 8px 0 6px; border: 2px solid #e2e2e2; border-radius: 7px; background: #fff;
  font-size: 12px; color: #888; cursor: pointer; text-align: left;
}
.bg-dd-btn:hover, .bg-dd-btn:focus-visible, .bg-dd.open .bg-dd-btn { border-color: #5aaa6a; outline: none; }
.bg-dd.has-active .bg-dd-btn { border-color: #3a7d44; background: #f0f7f1; color: #3a7d44; font-weight: 600; }
.bg-dd-btn .bg-thumb { height: 22px; border-radius: 2px; }
.bg-dd-val { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bg-dd-btn svg { flex-shrink: 0; transition: transform .15s; }
.bg-dd.open .bg-dd-btn svg { transform: rotate(180deg); }
.bg-dd-list {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; min-width: 100%;
  max-height: 300px; overflow-y: auto; margin: 0; padding: 4px; list-style: none;
  background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
}
.bg-dd-list[hidden] { display: none; }
.bg-dd-opt {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 5px; border-radius: 5px;
  font-size: 12px; color: #444; cursor: pointer; white-space: nowrap;
}
.bg-dd-opt .bg-thumb { height: 30px; border-radius: 2px; border: 1px solid #eee; }
.bg-dd-opt.is-active { background: #eef6ef; }
.bg-dd-opt[aria-selected="true"] { color: #3a7d44; font-weight: 600; }
.bg-dd-opt[aria-selected="true"]::after { content: '✓'; margin-left: auto; padding-left: 10px; }

/* 浮動預覽（fixed，不佔版面） */
.bg-preview {
  position: fixed; z-index: 1000; pointer-events: none; background: #fff; padding: 6px;
  border-radius: 8px; box-shadow: 0 10px 32px rgba(0,0,0,.28);
}
.bg-preview[hidden] { display: none; }
.bg-preview .bg-thumb { border-radius: 3px; }
.bg-preview .bg-thumb.o-p { width: 212px; }
.bg-preview .bg-thumb.o-l { width: 300px; }
.bg-preview-cap { font-size: 12px; color: #555; text-align: center; padding-top: 5px; }

/* ── Print ── */
@media print {
  @page { size: 210mm 297mm; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /*
   * Chrome prints at 96dpi → A4 = 793 × 1122 CSS px.
   * Our sheet is designed at 595 × 842 px (screen preview).
   * zoom: 1.334 scales 595 × 1.334 = 793 px  &  842 × 1.334 = 1123 px,
   * filling A4 exactly while preserving every fixed-px proportion.
   */
  html {
    zoom: 1.333; /* 842 × 1.333 = 1122.5 px = A4 height at 96 dpi — exact fit */
    width: 595px !important; height: auto !important;
    overflow: visible !important;
    margin: 0 !important; padding: 0 !important;
    background: none !important;
  }
  body {
    width: 595px !important; height: auto !important;
    overflow: visible !important;
    background: none !important; margin: 0 !important; padding: 0 !important;
  }
  .navbar, .editor-pane { display: none !important; }
  .workspace {
    display: block !important; width: 595px !important;
    height: auto !important; overflow: visible !important;
  }
  .preview-pane {
    position: static !important; display: block !important;
    background: none !important; overflow: visible !important;
    width: 595px !important; height: auto !important;
    padding: 0 !important; margin: 0 !important;
  }
  .dm-wrap {
    position: static !important; transform: none !important;
    display: block !important;
    margin: 0 !important; padding: 0 !important;
  }
  #dm-sheet {
    width: 595px !important; height: 842px !important;
    box-shadow: none !important; overflow: visible !important;
    display: flex !important;
  }
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════
   PRODUCTS
══════════════════════════════════════════════ */
const PRODUCTS = window.PRODUCTS || [];   /* 清單外移至 products.js，由 tools/build-copy.mjs 產生 */

/* ══════════════════════════════════════════════
   STATE
   cells[0..3] used by all layouts:
   four  → cells[0..3]  (2×2 grid)
   two   → cells[0..1]  (2 rows)
   one   → cells[0]     (single)
══════════════════════════════════════════════ */
let layout = 'four';
let bgTemplate = 'portrait'; // 'portrait' | 'h1' | 'h2' | 'h3'

const LAND_BG = {
  h1: '../沙龍DM公版/橫式/橫式1.jpg',
  h2: '../沙龍DM公版/橫式/橫式2.jpg',
  h3: '../沙龍DM公版/橫式/橫式3.jpg',
  h4: '../沙龍DM公版/橫式/大促橫式.jpg',
  p2: '../沙龍DM公版/直式/大促直式.jpg',   /* 直式滿版（非 header/footer 拆分） */
  p3: '../沙龍DM公版/直式/流程.jpg',       /* 流程：墨綠框頁首＋淺灰內容區（滿版）；底部箭頭線已抹除，由流程版面依價格文字長度繪製 */
};

/* 橫式底圖的內容覆蓋區座標（相對於 842×595 的 #dm-sheet）
   數值由實際底圖白色區自動偵測而來；如版面微歪，可在此微調百分比 */
const LAND_POS = {
  h1: { left: '43%', top: '15%', right: '8%', bottom: '15%' },  // 置中右側白框
  h2: { left: '37%', top: '3%',  right: '2%', bottom: '13%' },  // 右側滿版白＋下方footer
  h3: { left: '39%', top: '3%',  right: '3%', bottom: '14%' },  // 白區自 36% 起：左右各留約 3%，內容於白框內置中
  h4: { left: '45%', top: '3%',  right: '3%', bottom: '16%' },  // 2026大促橫式：左人像至 43%、下方footer 13%
  p2: { left: '3%',  top: '26.5%', right: '3%', bottom: '8%' }, // 2026大促直式：上人像至 25.2%、footer 自 92.5%；內容高≈551px 貼近直式（561px）→ 版面行為與直式一致
  p3: { left: '0',   top: '0',     right: '0',  bottom: '0' },    // 直式3＝流程版面專用：內容區＝整頁，各區塊於 renderFlow 以絕對座標定位
};

/* 底圖選單清單（順序＝選單顯示順序）。orient：'p' 直式、'l' 橫式；thumb：選單縮圖；label：UI 翻譯鍵。
   portrait 為頁首＋頁尾拆分，縮圖／預覽以 HDR＋FTR 組成（split: true）。 */
const BG_DIR = '../沙龍DM公版/';
const BG_LIST = [
  { id: 'portrait', orient: 'p',                               label: 'bgPortrait', split: true },
  { id: 'p2',       orient: 'p', thumb: '直式/縮圖/大促直式.jpg', label: 'bgP2' },
  { id: 'p3',       orient: 'p', thumb: '直式/縮圖/流程.jpg',     label: 'bgP3' },
  { id: 'h1',       orient: 'l', thumb: '橫式/縮圖/橫式1.jpg',    label: 'bgH1' },
  { id: 'h2',       orient: 'l', thumb: '橫式/縮圖/橫式2.jpg',    label: 'bgH2' },
  { id: 'h3',       orient: 'l', thumb: '橫式/縮圖/橫式3.jpg',    label: 'bgH3' },
  { id: 'h4',       orient: 'l', thumb: '橫式/縮圖/大促橫式.jpg', label: 'bgH4' },
];
const bgItem = id => BG_LIST.find(b => b.id === id);

/* 方向（決定 A4 尺寸/匯出方向）與滿版底圖（決定渲染模式）分開判斷 */
function isLandscape() { return (bgItem(bgTemplate) || {}).orient === 'l'; }
function isFullBg() { return bgTemplate !== 'portrait'; }   // 滿版底圖＋內容區絕對定位
/* 橫式2、3、4 的兩格＝單品特寫樣式（放大圖＋描述）；橫式1 仍為贈品樣式 */
function isFeatureTwo() { return ['h2', 'h3', 'h4'].includes(bgTemplate); }
/* 流程版面：選到此底圖即自動套用（隱藏版面選擇與標題欄），離開時回到先前版面 */
const FLOW_BG = 'p3';

   中文＝TWD（由產品建議售價自動帶入，存於 obj.price / obj.origPrice）；
   英/波蘭＝手動輸入、預設空白，存於 obj.i18nPrice[lang] / obj.i18nOrig[lang]。 */
function dispPrice(obj) {
  return lang === 'zh' ? (obj.price || '') : ((obj.i18nPrice && obj.i18nPrice[lang]) || '');
}
function dispOrig(obj) {
  return lang === 'zh' ? (obj.origPrice || '') : ((obj.i18nOrig && obj.i18nOrig[lang]) || '');
}
function setDispPrice(obj, field, val) { // field: 'price' | 'origPrice'
  if (lang === 'zh') { obj[field] = val; return; }
  const key = field === 'price' ? 'i18nPrice' : 'i18nOrig';
  (obj[key] = obj[key] || {})[lang] = val;
}

/* 括號：中文用全形（），英/波用半形() */
function paren(s) { return lang === 'zh' ? `（${s}）` : `(${s})`; }
/* 售價「數字＋幣別」內層 HTML（不換算；值為當前語言的售價字串，空白則不顯示）。
   幣別符號位置依語言；可指定 num/unit 的 class。 */
function priceInnerCls(val, numCls, unitCls) {
  const s = (val == null ? '' : String(val)).trim();
  if (!s) return '';
  const n = fmt(s);
  if (lang === 'en') return `<span class="${unitCls}">$</span><span class="${numCls}">${n}</span>`;
  if (lang === 'pl') return `<span class="${numCls}">${n}</span><span class="${unitCls}">&nbsp;zł</span>`;
  return `<span class="${numCls}">${n}</span><span class="${unitCls}">元</span>`;
}
const priceInner = (val) => priceInnerCls(val, 'dm-price-num', 'dm-price-unit');
/* 原價文字（不含外框括號；值空白或 0 則回空） */
function origText(val) {
  const s = (val == null ? '' : String(val)).trim();
  if (!s || s === '0') return '';
  const n = fmt(s);
  if (lang === 'en') return `Orig. $${n}`;
  if (lang === 'pl') return `dawniej ${n} zł`;
  return `原價NT$${n}`;
}
/* 產品名稱（依語言）：
   en → 優先用國際部官方英文品名（names-en.js，含容量）；查無再退回 i18n 翻譯。
   pl → i18n 翻譯基底名 + 容量後綴。查不到一律回中文。 */
function prodName(id) {
  const p = getProd(id);
  if (lang === 'zh') return p.name;
  if (lang === 'en') {
    const official = (window.PRODUCT_NAMES_EN || {})[p.id];
    if (official) return official;
  }
  const t = (window.PRODUCT_I18N || {})[p.copyKey];
  const base = t && t['name_' + lang];
  if (!base) return p.name;
  const suffix = p.name.indexOf(p.copyKey) === 0 ? p.name.slice(p.copyKey.length).trim() : '';
  return suffix ? `${base} ${suffix}` : base;
}

/* ══════════════════════════════════════════════
   底圖選單（依 BG_LIST 產生）
   有滑鼠：直式／橫式兩個下拉（W3C APG select-only combobox 行為），選項移入顯示浮動預覽
   觸控：直式／橫式兩列，左右滑動
══════════════════════════════════════════════ */
const BG_GROUPS = [{ orient: 'p', key: 'bgGroupP' }, { orient: 'l', key: 'bgGroupL' }];
const BG_CHEVRON = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>';

function bgThumbHTML(b) {
  const o = 'o-' + b.orient;
  if (b.split) return `<span class="bg-thumb ${o} is-split"><img class="hdr" src="${enc(HDR)}" alt="" decoding="async"><img class="ftr" src="${enc(FTR)}" alt="" decoding="async"></span>`;
  return `<span class="bg-thumb ${o}"><img src="${enc(BG_DIR + b.thumb)}" alt="" decoding="async"></span>`;
}

function buildBgPicker() {
  const box = document.getElementById('bg-pick');
  if (!box) return;
  closeBgDropdown();
  const dd = BG_GROUPS.map(g => {
    const items = BG_LIST.filter(b => b.orient === g.orient);
    return `<div class="bg-dd" data-orient="${g.orient}">
      <button type="button" class="bg-dd-btn" id="bg-dd-${g.orient}" role="combobox" aria-haspopup="listbox"
        aria-expanded="false" aria-controls="bg-lb-${g.orient}" aria-label="${t(g.key)}">
        <span class="bg-dd-ico"></span><span class="bg-dd-val"></span>${BG_CHEVRON}
      </button>
      <ul class="bg-dd-list" id="bg-lb-${g.orient}" role="listbox" aria-label="${t(g.key)}" hidden>
        ${items.map(b => `<li class="bg-dd-opt" role="option" id="bg-ddo-${b.id}" data-id="${b.id}" aria-selected="false">${bgThumbHTML(b)}<span>${t(b.label)}</span></li>`).join('')}
      </ul>
    </div>`;
  }).join('');
  const strips = BG_GROUPS.map(g => `<div class="bg-strip-row">
      <div class="bg-strip-title">${t(g.key)}</div>
      <div class="bg-strip">${BG_LIST.filter(b => b.orient === g.orient).map(b =>
        `<button type="button" class="bg-card" data-id="${b.id}" aria-label="${t(b.label)}">${bgThumbHTML(b)}<span class="bg-card-label">${t(b.label)}</span></button>`).join('')}</div>
    </div>`).join('');
  box.innerHTML = `<div class="bg-dd-row">${dd}</div><div class="bg-strips">${strips}</div>`;
  box.querySelectorAll('.bg-card').forEach(c => c.addEventListener('click', () => setBg(c.dataset.id)));
  box.querySelectorAll('.bg-dd').forEach(initBgDropdown);
  syncBgPicker();
}

function syncBgPicker() {
  const box = document.getElementById('bg-pick');
  if (!box) return;
  const cur = bgItem(bgTemplate);
  box.querySelectorAll('.bg-card').forEach(c => c.classList.toggle('active', c.dataset.id === bgTemplate));
  box.querySelectorAll('.bg-dd-opt').forEach(o => o.setAttribute('aria-selected', String(o.dataset.id === bgTemplate)));
  BG_GROUPS.forEach(g => {
    const wrap = box.querySelector(`.bg-dd[data-orient="${g.orient}"]`);
    if (!wrap) return;
    const on = !!cur && cur.orient === g.orient;
    wrap.classList.toggle('has-active', on);
    wrap.querySelector('.bg-dd-val').textContent = on ? t(cur.label) : t(g.key);
    wrap.querySelector('.bg-dd-ico').innerHTML = on ? bgThumbHTML(cur) : '';
  });
  // 觸控列：選中的卡片捲入可視範圍（只捲水平）
  const card = box.querySelector('.bg-card.active');
  if (card) {
    const strip = card.parentElement, r = card.getBoundingClientRect(), sr = strip.getBoundingClientRect();
    if (sr.width && (r.left < sr.left || r.right > sr.right)) strip.scrollLeft += r.left - sr.left - 4;
  }
}

let bgDdOpen = null;   // { wrap, btn, list, opts, idx }

function initBgDropdown(wrap) {
  const btn = wrap.querySelector('.bg-dd-btn');
  const opts = [...wrap.querySelectorAll('.bg-dd-opt')];
  btn.addEventListener('click', () => (bgDdOpen && bgDdOpen.wrap === wrap) ? closeBgDropdown() : openBgDropdown(wrap));
  btn.addEventListener('keydown', e => {
    const open = bgDdOpen && bgDdOpen.wrap === wrap;
    if (!open) {
      if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); openBgDropdown(wrap); }
      return;
    }
    let i = bgDdOpen.idx;
    if (e.key === 'ArrowDown') i = Math.min(opts.length - 1, i + 1);
    else if (e.key === 'ArrowUp') i = Math.max(0, i - 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = opts.length - 1;
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickBg(opts[i].dataset.id); return; }
    else if (e.key === 'Escape') { e.preventDefault(); closeBgDropdown(); return; }
    else if (e.key === 'Tab') { closeBgDropdown(); return; }
    else return;
    e.preventDefault();
    setBgDdActive(i);
  });
  opts.forEach((o, i) => {
    o.addEventListener('mouseenter', () => setBgDdActive(i));
    o.addEventListener('mousedown', e => e.preventDefault());   // 保持焦點在按鈕
    o.addEventListener('click', () => pickBg(o.dataset.id));
  });
}

function openBgDropdown(wrap) {
  closeBgDropdown();
  const btn = wrap.querySelector('.bg-dd-btn'), list = wrap.querySelector('.bg-dd-list');
  const opts = [...list.querySelectorAll('.bg-dd-opt')];
  list.hidden = false;
  wrap.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
  let idx = opts.findIndex(o => o.dataset.id === bgTemplate);
  if (idx < 0) idx = 0;
  bgDdOpen = { wrap, btn, list, opts, idx };
  setBgDdActive(idx);
}

function closeBgDropdown() {
  if (!bgDdOpen) return;
  const { wrap, btn, list, opts } = bgDdOpen;
  list.hidden = true;
  wrap.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
  btn.removeAttribute('aria-activedescendant');
  opts.forEach(o => o.classList.remove('is-active'));
  bgDdOpen = null;
  hideBgPreview();
}

function setBgDdActive(i) {
  const d = bgDdOpen;
  if (!d) return;
  d.idx = i;
  d.opts.forEach((o, k) => o.classList.toggle('is-active', k === i));
  const o = d.opts[i];
  d.btn.setAttribute('aria-activedescendant', o.id);
  const lr = d.list.getBoundingClientRect(), or = o.getBoundingClientRect();
  if (or.top < lr.top) d.list.scrollTop -= lr.top - or.top;
  else if (or.bottom > lr.bottom) d.list.scrollTop += or.bottom - lr.bottom;
  showBgPreview(o);
}

function pickBg(id) {
  closeBgDropdown();
  if (id !== bgTemplate) setBg(id);
}

function showBgPreview(optEl) {
  const b = bgItem(optEl.dataset.id);
  if (!b || !bgDdOpen) return;
  let pv = document.getElementById('bg-preview');
  if (!pv) {
    pv = document.createElement('div');
    pv.id = 'bg-preview';
    pv.className = 'bg-preview';
    pv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(pv);
  }
  pv.innerHTML = bgThumbHTML(b) + `<div class="bg-preview-cap">${t(b.label)}</div>`;
  pv.hidden = false;
  const lr = bgDdOpen.list.getBoundingClientRect(), or = optEl.getBoundingClientRect();
  const W = pv.offsetWidth, H = pv.offsetHeight;
  let x = lr.left - W - 12;                                    // 預設放在清單左側（預覽畫布上方）
  if (x < 8) x = Math.min(window.innerWidth - W - 8, lr.right + 12);
  const y = Math.max(8, Math.min(window.innerHeight - H - 8, or.top + or.height / 2 - H / 2));
  pv.style.left = x + 'px';
  pv.style.top = y + 'px';
}

function hideBgPreview() {
  const pv = document.getElementById('bg-preview');
  if (pv) pv.hidden = true;
}

document.addEventListener('pointerdown', e => {
  if (bgDdOpen && !bgDdOpen.wrap.contains(e.target)) closeBgDropdown();
});
window.addEventListener('resize', () => closeBgDropdown());

  const optFour = document.getElementById('opt-four');

const flowBaseName = id => prodName(id).replace(/\s*\d+(?:\.\d+)?\s*(?:ml|l|g|kg)\b/gi, '').trim();
function stepName(s) {
  if (s.name != null) return s.name;
  const names = [...new Set(s.prods.filter(id => getProdOrNull(id)).map(flowBaseName))];
  return names.join(' / ');
}
/* 說明＝步驟內每個商品的用途，以「 / 」隔開；用途相同者只寫一次（如同品不同容量） */
function stepDesc(s) {
  if (s.desc != null) return s.desc;
  const usages = s.prods.map(id => {
    const c = getCopy(id);
    return c && c.usage ? c.usage.trim() : '';
  }).filter(Boolean);
  return [...new Set(usages)].join(' / ');
}

/* ── QR Code：連結 → 以 qrcode-generator（cdnjs 固定版本，切到流程版面才載入）產生 PNG ── */
let qrLibPromise = null;
function ensureQrLib() {
  if (window.qrcode) return Promise.resolve();
  if (!qrLibPromise) {
    qrLibPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.crossOrigin = 'anonymous';
      s.onload = res;
      s.onerror = () => { qrLibPromise = null; rej(new Error('qrcode lib load failed')); };
      document.head.appendChild(s);
    });
  }
  return qrLibPromise;
}
const qrCache = new Map();
function qrDataURL(text) {
  if (qrCache.has(text)) return qrCache.get(text);
  if (!window.qrcode) {   // 函式庫尚未載入：先顯示佔位，載入後重繪
    ensureQrLib().then(() => { if (layout === 'flow') renderDM(); }).catch(() => {});
    return '';
  }
  const qr = window.qrcode(0, 'M');
  /* 函式庫預設逐字元取低 8 位 → 先轉 UTF-8 位元組字串，中文網址也正確 */
  qr.addData(String.fromCharCode(...new TextEncoder().encode(text)));
  qr.make();
  const n = qr.getModuleCount(), cell = 8, quiet = 2, size = (n + quiet * 2) * cell;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  g.fillStyle = '#EFF1EE'; g.fillRect(0, 0, size, size);
  g.fillStyle = '#4E4029';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) g.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
  const url = cv.toDataURL('image/png');
  qrCache.set(text, url);
  return url;
}

/* 步驟區：頁高 29%～89.6%（吊牌下緣到 QR 上方）；列高＝區高／步驟數 */
const FLOW_AREA_H = 510;
let flowFontTried = false;
function renderFlow() {
  const f = state.flow, n = f.steps.length;
  const rowH = FLOW_AREA_H / n;
  const imgH = Math.round(Math.min(rowH * 0.7, 128));
  const rows = f.steps.map((s, i) => {
    const imgs = s.prods.map(getProdOrNull).filter(Boolean).map(p =>
      `<img src="${enc(p.img)}" alt="" style="height:${imgH}px" onerror="this.style.opacity=0.1">`).join('');
    const desc = stepDesc(s);
    return `
      <div class="flow-row">
        <div class="flow-left">
          <div class="flow-conn is-top${i ? '' : ' is-blank'}">${i ? `<img class="flow-arrow" src="${FLOW_ARROW}" alt="">` : ''}</div>
          <div class="flow-pill"><span class="flow-num">${i + 1}</span><span class="flow-label">${flowEsc(s.label)}</span></div>
          <div class="flow-conn is-bottom${i < n - 1 ? '' : ' is-blank'}"></div>
        </div>
        <div class="flow-main${i ? ' has-sep' : ''}">
          <div class="flow-imgs">${imgs}</div>
          <div class="flow-text">
            <div class="flow-name">${flowEsc(stepName(s))}</div>
            ${desc ? `<div class="flow-desc">${flowEsc(desc)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  /* 價格列：線──》標語 $價格《──線 */
  const price = String(dispPrice(f) || '').trim();
  const priceHTML = !price ? ''
    : lang === 'pl' ? `<span class="flow-price-num">${fmt(price)}</span><span class="flow-price-unit">&nbsp;zł</span>`
    : `<span class="flow-price-num">$${fmt(price)}</span>`;
  const label = (f.priceLabel || '').trim();
  const priceBar = (label || price)
    ? `<div class="flow-price"><div class="flow-line"></div><img class="flow-chev" src="${FLOW_CHEV_R}" alt="">` +
      `<div class="flow-price-group">${label ? `<span class="flow-price-label">${flowEsc(label)}</span>` : ''}${priceHTML}</div>` +
      `<img class="flow-chev" src="${FLOW_CHEV_L}" alt=""><div class="flow-line"></div></div>`
    : `<div class="flow-price"><div class="flow-line"></div></div>`;

  /* QR：上傳圖片優先，否則由連結產生；兩者皆無則不顯示 */
  const url = (f.qrUrl || '').trim();
  let qr = '';
  if (f.qrImg || url) {
    const src = f.qrImg || qrDataURL(url);
    const qrLabel = (f.qrLabel || '').trim();
    qr = `<div class="flow-qr">${qrLabel ? `<div class="flow-qr-label">${flowEsc(qrLabel)}</div>` : ''}` +
         (src ? `<img src="${src}" alt="QR">` : '<div class="flow-qr-wait"></div>') + `</div>`;
  }

  /* 細體數字字型載入後重繪一次（量測以實際字型為準；載入失敗只試一次，避免無限重繪） */
  if (!flowFontTried && document.fonts && !document.fonts.check('200 34px Jost')) {
    flowFontTried = true;
    document.fonts.load('200 34px Jost', '0123456789$').then(() => { if (layout === 'flow') renderDM(); }).catch(() => {});
  }
  return `<div class="dm-flow"><div class="flow-steps">${rows}</div>${priceBar}${qr}</div>`;
}

/* 行距收緊一步：每次 -0.05 倍，低於 min 不再縮 */
function flowLineHeightStep(els, min) {
  return () => {
    let changed = false;
    els.forEach(el => {
      const cs = getComputedStyle(el);
      const cur = parseFloat(cs.lineHeight) / parseFloat(cs.fontSize);
      if (cur - 0.05 >= min) { el.style.lineHeight = (cur - 0.05).toFixed(2); changed = true; }
    });
    return changed;
  };
}
/* 文字欄右側留白縮小一步：每次 -4px，低於 min 不再縮 */
function flowWidenStep(els, min) {
  return () => {
    let changed = false;
    els.forEach(el => {
      const m = parseFloat(getComputedStyle(el).marginRight);
      if (m - 4 >= min) { el.style.marginRight = (m - 4) + 'px'; changed = true; }
    });
    return changed;
  };
}

/* 防破版：先縮說明→品名→商品圖→步驟名稱；價格列不得壓到 QR */
function fitFlow() {
  const q = s => [...document.querySelectorAll('#dm-sheet ' + s)];
  const rows = q('.flow-row');
  const steps = document.querySelector('#dm-sheet .flow-steps');
  shrinkStages(() => Math.max(0, overOf(steps), ...rows.map(overOf)), [
    fontStep(q('.flow-desc'), 0.85),
    fontStep(q('.flow-name'), 0.85),
    sizeStep(q('.flow-imgs img'), 0.6, true),   // 只縮高，寬度隨比例（圖未載入時寬為 0，不可鎖寬）
    fontStep(q('.flow-label'), 0.8),
    fontStep([...q('.flow-desc'), ...q('.flow-name'), ...q('.flow-label')], 0.7),
    sizeStep(q('.flow-imgs img'), 0.4, true),   // 極端（5 步＋外文長說明）：商品圖再讓位
    /* 最後手段（5 步×每步兩個不同商品×外文用途）：說明行距收緊，再讓文字欄往右延伸 */
    flowLineHeightStep(q('.flow-desc'), 1.3),
    flowWidenStep(q('.flow-main'), 18),
  ]);
  const group = document.querySelector('#dm-sheet .flow-price-group');
  if (!group) return;
  const sheet = document.getElementById('dm-sheet');
  const qrEl = document.querySelector('#dm-sheet .flow-qr');
  const over = () => {
    const g = group.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
    const right = qrEl ? qrEl.getBoundingClientRect().left - 8 : sr.right - 12;
    return Math.max(g.right - right, sr.left + 12 - g.left);
  };
  shrinkStages(over, [
    fontStep([...group.querySelectorAll('.flow-price-label')], 0.7),
    fontStep([...group.querySelectorAll('.flow-price-num, .flow-price-unit')], 0.7),
  ]);
}
